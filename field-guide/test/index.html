<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cülinary Expréss · Fíeld Güide (test drive)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f7;--side:#1e1e1e;--ink:#151515;--line:#e7e4df;--muted:#6b6b6b;--soft:#9a9a9a;--acc:#c45a0c;--ok:#1f8a4c;--warn:#c2700a;--card:#fff;--chip:#f1efeb}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 15px/1.5 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.test{background:#151515;color:#cfcfcf;font-size:12px;text-align:center;padding:6px 12px}.test a{color:#fff}
/* buttons */
.bk,.ol,.gr{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 24px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.bk{background:#151515;color:#fff}.bk:hover{background:#333}
.ol{background:#fff;color:#151515;box-shadow:inset 0 0 0 1px #151515}.ol:hover{background:#f3f1ed}
.gr{background:#e9e7e3;color:#444}.gr:hover{background:#dfdcd7}
.sm{min-height:34px;padding:0 14px;font-size:11.5px}
button:disabled{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--acc);font-weight:600;cursor:pointer;text-decoration:none;font-size:13px}
/* forms */
label.f{display:grid;gap:7px;font-size:14px;font-weight:600}
label.f .req{color:#d33}
.in{width:100%;height:44px;background:#fff;border:1px solid #cfcac3;border-radius:10px;padding:0 14px;font-size:15px}
textarea.in{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
.in:focus{outline:none;border-color:#151515;box-shadow:0 0 0 3px rgba(21,21,21,.08)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.cap{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;color:#333}
.chip input:checked+span{background:#151515;color:#fff}.chip input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.err{color:#b42318;font-size:13px;font-weight:600;min-height:18px}
/* auth */
.auth{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:calc(100vh - 29px)}
.auth .l{background:var(--side);color:#fff;padding:36px 36px 28px;display:flex;flex-direction:column}
.auth .r{background:#fff;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.auth .r>div{width:100%;max-width:600px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-decoration:none;color:inherit}
.brand img{width:34px;height:34px;border-radius:50%;background:#fff}
.auth h1{font-size:44px;line-height:1.05;letter-spacing:-.03em;margin:56px 0 12px;font-weight:700}
.auth .l p{color:#b5b5b5;margin:0}
.ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:12px;font-size:14px;color:#e6e6e6}.ul li{display:flex;gap:10px;align-items:baseline}.ul li::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;flex:none;transform:translateY(-2px)}
.quote{margin-top:auto;background:#2a2a2a;border-radius:10px;padding:18px;font-size:13px;color:#ddd}
.vt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vt label{cursor:pointer;position:relative}.vt input{position:absolute;opacity:0}
.vt span{display:block;border:1px solid #d9d4cd;border-radius:10px;padding:14px 16px;font-weight:700}.vt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.vt input:checked+span{background:#151515;color:#fff;border-color:#151515}.vt input:checked+span small{color:#bdbdbd}.vt input:focus-visible+span{outline:2px solid var(--acc)}
/* app shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 29px)}
.side{background:var(--side);color:#fff;padding:32px 0 28px;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 29px)}
.side .brand{padding:0 28px;font-size:17px;font-weight:500}
.nav{margin-top:56px;display:grid;gap:4px}
.nav a{display:block;padding:10px 28px 10px 34px;color:#cfcfcf;text-decoration:none;font-size:15px;position:relative}
.nav a:hover{color:#fff}.nav a.on{color:#fff;font-weight:600}.nav a.on::before{content:"";position:absolute;left:22px;top:8px;bottom:8px;width:2px;background:#fff;border-radius:2px}
.side .out{margin-top:auto;padding:0 28px;display:grid;gap:6px}
.side .out small{color:#8f8f8f;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.side .out button{background:none;border:0;color:#fff;text-align:left;padding:0;cursor:pointer;font-size:15px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 48px 22px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:34px;letter-spacing:-.025em;font-weight:600}
.sub{color:var(--muted);margin:6px 0 0}
.body{padding:32px 48px 40px;flex:1}
.wrap{max-width:1060px;margin:0 auto}
@media(max-width:900px){.app,.auth{grid-template-columns:1fr}.side{position:static;height:auto;padding:18px 0}.nav{margin-top:14px;display:flex;overflow-x:auto}.nav a{white-space:nowrap;padding:8px 14px}.nav a.on::before{display:none}.side .out{display:none}.top,.body{padding-left:20px;padding-right:20px}.auth .l{display:none}}
/* stepper */
.steps{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:6px auto 34px;max-width:900px}
.st{display:grid;justify-items:center;gap:8px;text-align:center;width:130px;font-size:13px;color:var(--soft);text-decoration:none}
.st .ic{width:36px;height:36px;border-radius:50%;border:1.5px solid #c9c5bf;display:flex;align-items:center;justify-content:center;color:#b5b1ab;background:#fff}
.st.done{color:var(--ink)}.st.done .ic{border-color:#151515;color:#151515}
.st.now{color:var(--acc);font-weight:600}.st.now .ic{border-color:var(--acc);color:var(--acc)}
.bar{flex:1;height:1.5px;background:#d6d2cc;margin-top:18px;min-width:20px}.bar.done{background:#151515}
@media(max-width:700px){.st{width:64px;font-size:11px}}
/* rows + cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:22px 24px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:14px}
.row .t{font-weight:600;font-size:16px}.row .d{color:var(--muted);font-size:14px}
.row.dim .t,.row.dim .d,.row.dim .ri{opacity:.55}
.ri{color:#333;display:flex}
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:18px 48px 26px}
.foot .c{display:grid;justify-items:center;gap:8px}.foot .c img{width:110px;height:auto}
.dots{display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:50%;background:#cfcac3}.dots i.on{background:#151515}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}.foot{padding:14px 20px}}
.sum{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}.sum span:first-child{color:var(--muted)}
.hr{height:1px;background:var(--line);margin:8px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px 10px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 10px 13px 0;border-bottom:1px solid #f0ede8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.qty{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #cfcac3;background:#fff;cursor:pointer;line-height:1}
.qty output{min-width:28px;text-align:center}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);color:#333;white-space:nowrap}
.pill.k{background:#151515;color:#fff}.pill.o{background:#fdf1e6;color:var(--acc)}.pill.g{background:#e8f5ee;color:var(--ok)}
.ok{color:var(--ok);font-weight:600}.pend{color:var(--warn);font-weight:600}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tl div{display:grid;gap:8px;font-size:12.5px;color:var(--soft)}.tl i{height:6px;border-radius:3px;background:#e6e3de}
.tl .on i{background:var(--acc)}.tl .on{color:var(--acc)}
.vcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vcard .ph{height:130px;background:linear-gradient(135deg,#efebe5,#e2ddd5);display:flex;align-items:center;justify-content:center;color:#8b857c;font-size:13px}
.vcard .b{padding:14px 16px 16px;display:grid;gap:6px;flex:1}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs a,.tabs button{padding:0 0 12px;font-size:15px;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;border-bottom:2px solid transparent}
.tabs .on{color:var(--acc);border-color:var(--acc);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal>div{background:#fff;border-radius:16px;width:min(920px,100%);max-height:90vh;overflow:auto;padding:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#151515;color:#fff;padding:12px 18px;border-radius:10px;z-index:80;font-weight:600;font-size:14px}
.hero{background:#151515;color:#fff;text-align:center;padding:56px 24px 64px}
.hero h1{font-size:clamp(30px,4vw,44px);margin:0;letter-spacing:-.02em}
.search{display:flex;gap:8px;max-width:640px;margin:22px auto 0;background:#fff;border-radius:999px;padding:6px}
.search input{flex:1;border:0;padding:0 16px;font-size:15px;outline:none;border-radius:999px;color:#151515}
.pub{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line)}
.pub nav{display:flex;gap:28px;font-size:14px}.pub nav a{text-decoration:none;color:#333}
@media(max-width:700px){.pub nav{display:none}}
</style>
</head>
<body>
<div class="test">Test drive · sample vendors &amp; prices · accounts are simulated (no passwords; sign-in codes appear on screen) · <a href="#/admin">Super Admin</a> · <a href="#" id="reset">Start over</a></div>
<div id="app"></div>
<script>
(() => {
const LOGO = '/assets/culinary-express-logo.png';
const CAR = 'https://www.culinary.express/assets/images/car.svg';
const CAL = 'https://calendly.com/theexpress';
const TYPES = ['Restaurant', 'Event Venue', 'Farm', 'Winery', 'Bakery + Desserts', 'Coffee + Espresso', 'Bar + Drinks', 'Rentals', 'Entertainment'];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toast = m => { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); };
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- icons ----------
const I = (p, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic = {
  party: I('<path d="M4 20l5-14 9 9-14 5z"/><path d="M14 4l1 2M19 9l2-1M17 3l-1 3M21 5l-3 1"/>'),
  food: I('<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/>'),
  staff: I('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.8.4 5 2.8 5 5.8"/>'),
  quote: I('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>'),
  heart: I('<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>'),
  send: I('<path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"/>'),
  phone: I('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'),
  layers: I('<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>'),
  search: I('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>', 16),
  store: I('<path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/>'),
  back: I('<path d="M15 6l-6 6 6 6"/>'),
  doc: I('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>')
};

// ---------- state ----------
let SESS = store.get('fg-sess', null), ADM = (() => { try { return sessionStorage.getItem('fg-adm') || ''; } catch { return ''; } })();
let LIVE = [], ME = null, AD = null, S = store.get('fg-draft', null);
const blank = () => ({ inq: { title: '', description: '', guaranteed: '', expected: '', date: '', start: '18:00', end: '22:00', location: '', type: 'Full event', service: 'Buffet with service' }, picks: [], gems: [], recommend: [], sel: {}, staff: null, mat: null, booked: false });
if (!S) S = blank();
const setSess = x => { SESS = x; ME = null; store.set('fg-sess', x); };
const saveDraft = () => store.set('fg-draft', S);
async function api(a, body = {}) {
  const r = await fetch('/api/fg?a=' + a, { method: 'POST', headers: { 'content-type': 'application/json', 'x-token': SESS?.token || '', 'x-admin-code': ADM }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'Network error. Try again.' }));
  if (!r.ok) { if (r.status === 401 && !a.startsWith('admin')) { setSess(null); } throw new Error(j.error || 'Something went wrong'); }
  return j;
}
const merge = ev => { S = { ...S, ...ev }; saveDraft(); };
let syncT; const sync = () => { saveDraft(); if (!SESS || !S.id || S.quote) return; clearTimeout(syncT); syncT = setTimeout(async () => { try { merge((await api('saveEvent', { event: S })).event); } catch {} }, 700); };
const loadLive = async () => { try { LIVE = (await api('vendors')).vendors || []; } catch { LIVE = []; } };
const loadMe = async () => { ME = await api('me'); return ME; };
const role = () => SESS?.account?.roles?.includes('vendor') && !SESS?.account?.roles?.includes('client') ? 'vendor' : 'client';

// ---------- sample directory (placeholders for testing) ----------
const SAMPLES = [
  { id: 'lib-1', name: 'Sample Taquería', type: 'Restaurant', hood: 'Mission', blurb: 'Family recipes, big trays.', items: [['Carnitas tray', 'Salsa verde, tortillas', 95, 'per tray (10)'], ['Vegetable enchiladas', 'Mole, queso fresco', 85, 'per tray (10)'], ['Rice + beans', '', 45, 'per tray (10)'], ['Chips + three salsas', '', 30, 'per tray (10)']] },
  { id: 'lib-2', name: 'Sample Trattoria', type: 'Restaurant', hood: 'North Beach', blurb: 'Fresh pasta and antipasti.', items: [['Lasagna', 'Bolognese, béchamel', 110, 'per tray (12)'], ['Caesar salad', '', 55, 'per tray (12)'], ['Focaccia', 'Rosemary, sea salt', 25, 'per tray (12)']] },
  { id: 'lib-3', name: 'Sample Bakery', type: 'Bakery + Desserts', hood: 'Inner Sunset', blurb: 'Cakes, cookies, churros.', items: [['Churros', 'Chocolate dip', 36, 'per dozen'], ['Tres leches', '', 70, 'per half sheet'], ['Cookie platter', 'Assorted', 30, 'per dozen']] },
  { id: 'lib-4', name: 'Sample Espresso Cart', type: 'Coffee + Espresso', hood: 'Citywide', blurb: 'Barista-made drinks on site.', items: [['Espresso cart service', '3 hours', 450, 'per event'], ['Extra hour', '', 120, 'per hour']] },
  { id: 'lib-5', name: 'Sample Wine Bar', type: 'Bar + Drinks', hood: 'Hayes Valley', blurb: 'Natural wine and beer.', items: [['Wine + beer package', '3 hours', 28, 'per person'], ['Agua fresca', 'Two flavors', 3, 'per person']] },
  { id: 'lib-6', name: 'Sample Valley Farm', type: 'Farm', hood: 'Sonoma', blurb: 'Seasonal produce boxes.', items: [['Grazing board', 'Farm cheeses, fruit', 180, 'per board (20)']] },
  { id: 'lib-7', name: 'Sample Loft Venue', type: 'Event Venue', hood: 'SoMa', blurb: 'Up to 80 guests.', items: [['Evening rental', '6 hours', 1200, 'per event']] },
  { id: 'lib-8', name: 'Sample Ridge Winery', type: 'Winery', hood: 'Napa', blurb: 'Estate wines, tours.', items: [['Wine pairing', 'Three pours', 22, 'per person']] }
].map(v => ({ ...v, sample: true, items: v.items.map(([n, d, p, u]) => ({ n, d, p, u })) }));
const directory = () => [...LIVE, ...SAMPLES];
const vById = id => directory().find(v => v.id === id);
function eventVendors(ev = S) {
  const out = [], seen = new Set();
  (ev.picks || []).forEach(id => { const v = vById(id); if (v && !seen.has(v.id)) { seen.add(v.id); out.push({ ...v, how: 'Your pick' }); } });
  (ev.gems || []).filter(g => g.name).forEach((g, i) => { const L = g.inviteId && LIVE.find(v => (v.inviteIds || []).includes(g.inviteId)); if (L) { if (!seen.has(L.id)) { seen.add(L.id); out.push({ ...L, how: 'Your local gem' }); } } else out.push({ id: g.inviteId ? 'inv-' + g.inviteId : 'gem-' + i, name: g.name, type: g.type, items: [], how: 'Invited · menu pending', pending: true }); });
  (ev.recommend || []).forEach(t => { const v = directory().find(x => x.type === t && !seen.has(x.id)); if (v) { seen.add(v.id); out.push({ ...v, how: 'Our local gem' }); } });
  return out.map(v => ({ ...v, items: (v.items || []).map((it, j) => ({ ...it, id: v.id + '-' + j })) }));
}
const guests = (ev = S) => Math.max(1, parseInt(ev.inq?.guaranteed) || parseInt(ev.inq?.expected) || 40);
const hours = (ev = S) => { const t = x => { const [h, m] = String(x || '0:0').split(':').map(Number); return (h || 0) + (m || 0) / 60; }; let d = t(ev.inq?.end) - t(ev.inq?.start); if (d <= 0) d += 24; return Math.max(2, Math.round(d)); };
const staffPlan = (ev = S) => { const g = guests(ev), h = hours(ev), svc = ev.inq?.service || '', drop = ev.inq?.type === 'Catering delivery'; return [
  { k: 'captain', n: 'Event captain', q: drop ? 0 : 1, h: h + 1, r: 55 }, { k: 'server', n: 'Server', q: drop ? 0 : Math.ceil(g / (svc === 'Plated dinner' ? 10 : 15)), h, r: 40 },
  { k: 'bartender', n: 'Bartender', q: eventVendors(ev).some(v => v.type === 'Bar + Drinks') ? Math.ceil(g / 50) : 0, h: Math.max(2, h - 1), r: 45 }, { k: 'barista', n: 'Barista', q: eventVendors(ev).some(v => v.type === 'Coffee + Espresso') ? 1 : 0, h: 3, r: 40 },
  { k: 'driver', n: 'Driver', q: 1, h: 2, r: 35 }, { k: 'setup', n: 'Setup + breakdown', q: drop ? 0 : Math.ceil(g / 25), h: 3, r: 35 }]; };
const matPlan = (ev = S) => { const g = guests(ev), t = Math.ceil(g / 8) + 2, buf = /Buffet/.test(ev.inq?.service || ''); return [
  { k: 'tables', n: 'Round tables (60")', u: 'units', q: t, p: 12 }, { k: 'chairs', n: 'Chairs', u: 'units', q: g, p: 4 }, { k: 'linens', n: 'Linens + napkins', u: 'sets', q: t, p: 14 },
  { k: 'plates', n: 'Plates (dinner + dessert)', u: 'units', q: g * 2, p: 1 }, { k: 'cutlery', n: 'Cutlery sets', u: 'sets', q: g, p: 1.5 }, { k: 'glass', n: 'Glassware', u: 'units', q: g * 2, p: 1 },
  { k: 'chafing', n: 'Chafing dishes + fuel', u: 'units', q: buf ? Math.max(4, Math.ceil(g / 8)) : 0, p: 18 }]; };

  const os = ME.orders || [];
  return shell('vendor', 'vendor/orders', 'Orders', `<div class="wrap">${os.length ? os.map(o => `<article class="card" style="margin-bottom:16px;overflow:hidden"><div class="pad" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)"><div><p class="cap">Next action</p><b style="font-size:17px">${o.status === 'waiting' ? 'Review &amp; accept order' : o.status === 'confirmed' ? 'Order accepted' : 'Order declined'}</b><div class="hint">${o.status === 'waiting' ? 'Review order details and confirm you can fulfill this request.' : 'Your Lead Planner has your answer.'}</div></div>${o.status === 'waiting' && o.quoteStatus === 'requested' ? `<div style="display:flex;gap:8px"><button class="bk sm" type="button" data-ok="${o.id}">Accept order</button><button class="ol sm" type="button" data-no="${o.id}">Reject</button></div>` : `<span class="pill ${o.status === 'confirmed' ? 'g' : ''}">${o.status === 'confirmed' ? 'Confirmed' : o.status}</span>`}</div>
  <div class="pad"><div class="grid3"><div><p class="cap">Event</p>${esc(o.title || o.type || '')}</div><div><p class="cap">Date</p>${esc(o.date || 'TBD')} ${o.start ? '· ' + esc(o.start) : ''}</div><div><p class="cap">Guests</p>${esc(o.guests || '')}</div></div>
  <table class="tbl" style="margin-top:12px"><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Total</th></tr></thead><tbody>${o.items.map(i => `<tr><td>${esc(i.n)} <span class="hint">${esc(i.u)}</span></td><td>×${i.q}</td><td>${money(i.p)}</td><td><b>${money(i.p * i.q)}</b></td></tr>`).join('') || '<tr><td colspan="4" class="hint">Menu pending: your Lead Planner will share the order.</td></tr>'}</tbody></table></div></article>`).join('') : '<div class="card pad"><b>No orders yet.</b><p class="hint">Publish your page so clients can add you to their events.</p></div>'}</div>`, { sub: 'Requests from clients who added you to their event.' }); };
H['vendor/orders'] = () => { const go2 = async (id, d) => { try { await api('vendorRespond', { id, decision: d }); await loadMe(); toast(d === 'decline' ? 'Declined.' : 'Accepted.'); render(); } catch (x) { toast(x.message); } }; $$('[data-ok]').forEach(b => b.onclick = () => go2(b.dataset.ok, 'accept')); $$('[data-no]').forEach(b => b.onclick = () => go2(b.dataset.no, 'decline')); };

// ---------- admin ----------
const adminGate = () => shell('admin', 'admin', 'Dispatch Board', `<form id="ag" class="card pad" style="max-width:420px;display:grid;gap:14px" novalidate><b>Super Admin access</b><label class="f">Admin code<input class="in" id="acode" type="password" autocomplete="off" required></label><span class="err" id="err" role="alert"></span><button class="bk" type="submit">Continue</button></form>`);
const loadAd = async () => { AD = await api('adminData'); LIVE = AD.vendors.filter(v => v.status === 'live'); };
V['admin'] = () => { if (!ADM) return adminGate(); if (!AD) { loadAd().then(render).catch(e => { if (/Admin code/.test(e.message)) { ADM = ''; try { sessionStorage.removeItem('fg-adm'); } catch {} } toast(e.message); render(); }); return shell('admin', 'admin', 'Dispatch Board', '<p class="hint">Loading…</p>'); }
  const evs = AD.events.filter(e => e.quote || e.inq?.title);
  return shell('admin', 'admin', 'Dispatch Board', `<div class="wrap"><div style="display:flex;gap:10px;margin-bottom:18px"><input class="in" id="as" placeholder="Search dispatches…" aria-label="Search dispatches"><button class="ol" type="button" id="ar">Refresh</button></div><div id="alist">${evs.map(ev => eventCard(ev, `#/admin/ticket/${ev.id}`).replace('<div class="grid2" style="margin-top:16px">', `<div class="grid2" style="margin-top:16px"><div><p class="cap">Primary contact</p>${esc(ev.ownerName || '')} · ${esc(ev.ownerPhone || ev.owner)}</div><div><p class="cap">Assigned lead</p>${esc(ev.lead || 'Matthew')}</div>`)).join('') || '<p class="hint">No events yet. Create one from a client account.</p>'}</div></div>`, { sub: 'Track timelines, contacts and delivery/event progress.' }); };
H['admin'] = () => { const g = $('#ag'); if (g) { g.onsubmit = async e => { e.preventDefault(); ADM = $('#acode').value.trim(); try { await api('adminCheck'); try { sessionStorage.setItem('fg-adm', ADM); } catch {} AD = null; render(); } catch (x) { ADM = ''; $('#err').textContent = 'That code is not right.'; } }; return; }
  const r = $('#ar'); if (r) r.onclick = () => { AD = null; render(); }; const s = $('#as'); if (s) s.oninput = () => $$('#alist > article').forEach(a => a.hidden = !a.textContent.toLowerCase().includes(s.value.toLowerCase())); };
let ATAB = 'order';
V['admin/ticket'] = () => { if (!ADM) return adminGate(); if (!AD) { loadAd().then(render).catch(e => toast(e.message)); return shell('admin', 'admin', 'Dispatch Board', '<p class="hint">Loading…</p>'); }
  const ev = AD.events.find(e => e.id === PARAM); if (!ev) return shell('admin', 'admin', 'Not found', '<a class="ol" href="#/admin">Back to Dispatch Board</a>');
  ensure(ev); const q = ev.quote, i = q ? qIdx(q.status) : -1, vs = eventVendors(ev), t = totals(ev), inv = AD.invites.filter(x => x.eventId === ev.id);
  const allOk = q && Object.values(q.vendors).every(s => s === 'confirmed');
  const conf = id => !q ? '' : q.vendors[id] === 'confirmed' ? '<span class="ok">Confirmed</span>' : q.status === 'requested' && id in q.vendors ? `<button class="bk sm" type="button" data-cf="${esc(id)}">Confirm</button>` : `<span class="pend">${q.vendors[id] === 'declined' ? 'Declined' : 'Pending'}</span>`;
  const NA = !q ? ['Planning', 'Client is still building this event.', ''] : q.status === 'requested' ? ['Confirm vendors', allOk ? 'Everything is confirmed. Send the final quote to the client.' : 'Confirm each vendor, staffing and materials, then send the quote.', `<button class="bk sm" type="button" id="sendq" ${allOk ? '' : 'disabled'}>Send quote</button>`] : q.status === 'quoted' ? ['Quote sent · awaiting approval', 'Client received the quote. Waiting for approval.', ''] : q.status === 'approved' ? ['Finalize logistics', 'Approved. Assign staff, confirm driver and materials.', '<button class="bk sm" type="button" data-st="in_progress">Mark in progress</button>'] : q.status === 'in_progress' ? ['Event underway', 'Staff and delivery are active.', '<button class="bk sm" type="button" data-st="completed">Mark as completed</button>'] : ['Order completed', 'All services delivered.', ''];
  const body = `<div class="wrap" style="max-width:1200px"><a class="lnk" href="#/admin">← Back to Dispatch Board</a>
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0 4px"><h2 style="margin:0;font-size:26px">${esc(ev.ownerName || 'Client')} — ${esc(ev.inq?.title || '')}</h2><div style="display:flex;gap:8px"><a class="ol sm" href="mailto:${esc(ev.owner)}">Email client</a><a class="ol sm" href="tel:${esc(ev.ownerPhone || '')}">Call</a></div></div>
  <div class="hint">${esc(ev.inq?.date || 'TBD')} · ${esc(ev.id)}</div>
  <div class="tabs" style="margin-top:18px">${[['order', 'Order Details'], ['sheet', 'Instruction Sheet'], ['inv', 'Vendor Invites']].map(([k, n]) => `<button type="button" data-tab="${k}" class="${ATAB === k ? 'on' : ''}">${n}</button>`).join('')}</div>
  <div class="card pad" style="margin-bottom:16px"><div class="steps" style="margin:0 auto;max-width:none">${QS.map(([k, n], j) => `${j ? `<span class="bar ${j <= i ? 'done' : ''}"></span>` : ''}<span class="st ${j < i ? 'done' : j === i ? 'now' : ''}"><span class="ic" style="font-weight:700;font-size:13px">${j + 1}</span>${n}</span>`).join('')}</div></div>
  ${ATAB === 'order' ? `<div style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start">
   <div style="display:grid;gap:16px"><div class="card pad"><p class="cap">Order details</p><div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px"><div><p class="hint">Dispatch type</p><b>${esc(ev.inq?.type || '')}</b></div><div><p class="hint">Event date</p><b>${esc(ev.inq?.date || 'TBD')} · ${esc(ev.inq?.start || '')}</b></div><div><p class="hint">Guests</p><b>${guests(ev)} guests</b></div><div><p class="hint">Service</p><b>${esc(ev.inq?.service || '')}</b></div></div>${ev.inq?.description ? `<p class="hint" style="margin-top:10px">${esc(ev.inq.description)}</p>` : ''}</div>
    <div class="card pad"><p class="cap">Food / menu</p>${vs.map(v => { const its = v.items.filter(x => ev.sel?.[x.id]); return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px"><b>${esc(v.name)} <span class="pill ${v.how === 'Your pick' ? 'k' : 'o'}">${esc(v.how)}</span></b>${conf(v.id)}</div>${its.length ? `<table class="tbl"><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Total</th></tr></thead><tbody>${its.map(x => `<tr><td>${esc(x.n)} <span class="hint">${esc(x.u)}</span></td><td>×${ev.sel[x.id]}</td><td>${money(x.p)}</td><td><b>${money(x.p * ev.sel[x.id])}</b></td></tr>`).join('')}</tbody></table>` : `<p class="hint" style="margin:4px 0 0">${v.pending ? 'Invited · menu pending' : 'No items selected'}</p>`}`; }).join('')}</div>
    <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center"><p class="cap">Labor</p>${conf('staff')}</div>${staffPlan(ev).filter(r => ev.staff[r.k]?.q).map(r => `<div class="sum" style="border-bottom:1px solid #f0ede8"><span style="color:var(--ink)"><span style="color:var(--ok)">●</span> ${r.n}</span><span class="hint">${ev.staff[r.k].q} × ${ev.staff[r.k].h}h</span><b>${money(ev.staff[r.k].q * ev.staff[r.k].h * r.r)}</b></div>`).join('')}<div class="sum"><span>Estimated labor cost</span><b>${money(t.labor)}</b></div></div>
    <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center"><p class="cap">Materials</p>${conf('materials')}</div>${matPlan(ev).filter(m => ev.mat[m.k]?.q).map(m => `<div class="sum" style="border-bottom:1px solid #f0ede8"><span style="color:var(--ink)">${m.n}</span><span class="hint">${ev.mat[m.k].q} ${m.u}</span><span class="${ev.mat[m.k].src === 'ce' ? '' : 'hint'}">${{ ce: 'Ours', have: 'Client has', vendor: 'Vendor' }[ev.mat[m.k].src]}</span></div>`).join('')}<div class="sum"><span>Estimated cost</span><b>${money(t.mat)}</b></div></div></div>
   <div style="display:grid;gap:16px"><div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><p class="cap">Next action</p>${NA[2]}</div><div class="hr"></div><b>${NA[0]}</b><p class="hint" style="margin:4px 0 0">${NA[1]}</p></div>
    <div class="card pad"><p class="cap">Order value</p><div class="sum"><span>Food &amp; menu</span><span>${money(t.food)}</span></div><div class="sum"><span>Delivery</span><span>Price on quote</span></div><div class="sum"><span>Labor</span><span>${money(t.labor)}</span></div><div class="sum"><span>Materials</span><span>${money(t.mat)}</span></div><div class="sum"><span>Coupon</span><span>−${money(t.coupon)}</span></div><div class="hr"></div><div class="sum"><b>Estimated total</b><b>${money(t.total)} + delivery</b></div></div>
    <div class="card pad"><p class="cap">Delivery</p><p class="hint" style="margin:10px 0 2px">Drop-off</p><b>${esc(ev.inq?.location || 'TBD')}</b><div class="sum" style="margin-top:8px"><span>Driver</span><span class="pend">${ev.staff.driver?.q ? 'To assign' : 'Not needed'}</span></div></div>
    <div class="card pad"><p class="cap">Other notes</p><p class="hint" style="margin:8px 0 0">${esc(ev.inq?.description || 'None')}</p></div></div></div>` : ATAB === 'sheet' ? `<div class="card pad"><p class="cap">Run of show</p>${[['−2h', 'Vendor pickups + rentals load'], ['−1h', 'Staff arrive, briefing'], ['−15m', 'Setup complete'], ['Start', 'Doors / service begins'], ['End', 'Breakdown + cleanup']].map(([a, b]) => `<div class="sum" style="border-bottom:1px solid #f0ede8"><b style="width:70px">${a}</b><span style="flex:1;color:var(--ink)">${b}</span></div>`).join('')}<p class="hint" style="margin-top:12px">Times are relative to ${esc(ev.inq?.start || 'start')}–${esc(ev.inq?.end || 'end')}. Editable instruction sheets come next.</p></div>`
  : `<div class="card pad"><p class="cap">Vendor invites from this client</p>${inv.length ? inv.map(x => `<div class="sum" style="border-bottom:1px solid #f0ede8;align-items:center"><span style="color:var(--ink)"><b>${esc(x.gemName)}</b> · ${esc(x.type)} ${x.link ? '· ' + esc(x.link) : ''}</span><span class="${x.status === 'joined' ? 'ok' : 'pend'}">${x.status === 'joined' ? 'Joined' : 'Invite sent'}</span><button class="ol sm" type="button" data-copy="${location.origin}${location.pathname}#/vendor/join/${x.id}">Copy invite link</button></div>`).join('') : '<p class="hint">This client did not add their own vendors.</p>'}<p class="hint" style="margin-top:12px">In production the invite is emailed to the vendor. Here, copy the link and open it to test vendor sign-up.</p></div>`}</div>`;
  return shell('admin', 'admin', 'Dispatch Board', body); };
H['admin/ticket'] = () => { if (!ADM) return H['admin'](); const up = async b => { try { const j = await api('adminUpdate', { id: PARAM, ...b }); const k = AD.events.findIndex(e => e.id === PARAM); AD.events[k] = j.event; render(); } catch (x) { toast(x.message); } };
  $$('[data-tab]').forEach(b => b.onclick = () => { ATAB = b.dataset.tab; render(); }); $$('[data-cf]').forEach(b => b.onclick = () => up({ confirm: b.dataset.cf }));
  const s = $('#sendq'); if (s) s.onclick = () => up({ status: 'quoted' }); $$('[data-st]').forEach(b => b.onclick = () => up({ status: b.dataset.st }));
  $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Invite link copied'); } catch { prompt('Copy this link', b.dataset.copy); } }); };
V['admin/vendors'] = () => { if (!ADM) return adminGate(); if (!AD) { loadAd().then(render).catch(e => toast(e.message)); return shell('admin', 'admin/vendors', 'Vendors', '<p class="hint">Loading…</p>'); }
  return shell('admin', 'admin/vendors', 'Vendors', `<div class="wrap"><div class="card pad scroll"><table class="tbl"><thead><tr><th>Vendor</th><th>Type</th><th>Items</th><th>Status</th></tr></thead><tbody>${AD.vendors.map(v => `<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.type)}</td><td>${v.items.length}</td><td><span class="pill ${v.status === 'live' ? 'g' : ''}">${v.status === 'live' ? 'Live' : 'Draft'}</span></td></tr>`).join('') || '<tr><td colspan="4" class="hint">No vendor accounts yet.</td></tr>'}</tbody></table></div>
  <div class="card pad" style="margin-top:16px"><p class="cap">Invites</p>${AD.invites.map(x => `<div class="sum" style="border-bottom:1px solid #f0ede8"><span style="color:var(--ink)">${esc(x.gemName)} · ${esc(x.type)}</span><span class="${x.status === 'joined' ? 'ok' : 'pend'}">${x.status === 'joined' ? 'Joined' : 'Invite sent'}</span></div>`).join('') || '<p class="hint">No invites yet.</p>'}</div></div>`, { sub: 'Vendor pages and client invites.' }); };

// ---------- shared ----------
function modal(html, after) { const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.innerHTML = `<div>${html}</div>`; document.body.appendChild(m); const close = () => { m.remove(); document.removeEventListener('keydown', esc_); render(); }; const esc_ = e => { if (e.key === 'Escape') close(); }; document.addEventListener('keydown', esc_); m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(); }); after && after(m); }
function openCal() { const u = `${CAL}?hide_gdpr_banner=1&name=${encodeURIComponent(SESS?.account?.name || '')}&email=${encodeURIComponent(SESS?.account?.email || '')}`;
  modal(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0">Book a call with your Lead Planner</h2><button class="ol sm" type="button" data-close>Close</button></div><iframe src="${u}" title="Book a call on Calendly" style="width:100%;height:620px;border:0;border-radius:10px"></iframe><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="bk" type="button" id="booked">I booked my call</button></div>`, m => { m.querySelector('#booked').onclick = () => { S.booked = true; sync(); m.remove(); toast('Call noted on your event.'); render(); }; }); }
function go(r) { location.hash = '#/' + r; }
function render() { let r = location.hash.replace(/^#\/?/, '').split('?')[0] || ''; PARAM = null; for (const p of ['admin/ticket', 'vendor/join', 'open']) if (r.startsWith(p + '/')) { PARAM = decodeURIComponent(r.slice(p.length + 1)); r = p; } const v = V[r] || V['']; $('#app').innerHTML = v(); (H[r] || (() => {}))();
  const lo = $('#logout'); if (lo) lo.onclick = () => { if (location.hash.includes('admin')) { ADM = ''; AD = null; try { sessionStorage.removeItem('fg-adm'); } catch {} } else { setSess(null); S = blank(); saveDraft(); } go(''); };
  const bc = $('#bookcall'); if (bc) bc.onclick = openCal; }
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/create')) ME = ME; render(); window.scrollTo(0, 0); });
$('#reset').onclick = e => { e.preventDefault(); setSess(null); S = blank(); saveDraft(); PEND = null; INV = null; VD = null; go(''); render(); };
render(); loadLive().then(() => { if (!/admin/.test(location.hash)) render(); });
})();
</script>
