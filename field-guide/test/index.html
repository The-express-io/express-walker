<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cülinary Expréss · Order Your Moment (test drive)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1412;--muted:#5a5f5c;--line:#e6e6e6;--soft:#f4f4f4;--blue:#0047ab;--blue2:#00337d;--sky:#4f7dff;--ok:#1d7a46;--warn:#9a5b00}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 16px/1.55 Manrope,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.bar{height:32px;background:#0f1412;color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:0 12px;text-align:center}
.bar a{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.4)}
header.h{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.h .in{height:72px;padding:0 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nl{display:flex;gap:28px}.nl a{font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:4px 0;border-bottom:1px solid transparent}.nl a:hover,.nl a.on{border-color:currentColor}
.wm{display:flex;align-items:center;gap:12px;text-decoration:none}.wm img{width:34px;height:34px;border-radius:50%;background:#fff}.wm span{font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.hr{justify-self:end;display:flex;align-items:center;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:999px;font-size:14.5px;font-weight:600;text-decoration:none;border:0;cursor:pointer;white-space:nowrap;transition:background .2s,opacity .2s}
.dk{background:#0f1412;color:#fff}.dk:hover{background:#2b302d}
.bl{background:var(--blue);color:#fff}.bl:hover{background:var(--blue2)}
.wt{background:#fff;color:#0f1412}.wt:hover{background:#ececec}
.ln{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}.ln:hover{background:rgba(0,0,0,.04)}
.sm{min-height:36px;padding:0 16px;font-size:13px}
.caps{font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
button:disabled{opacity:.4;cursor:not-allowed}
.u{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(0,0,0,.25)}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}.narrow{max-width:860px;margin:0 auto;padding:0 40px}
h1,h2,h3{font-weight:600;letter-spacing:-.04em;margin:0}
.d1{font-size:clamp(48px,7vw,104px);line-height:.95}.d2{font-size:clamp(34px,4.6vw,60px);line-height:1}.d3{font-size:26px;letter-spacing:-.03em}
.lead{font-size:19px;color:var(--muted);margin:14px 0 0;max-width:620px}
.m{color:var(--muted)}.sml{font-size:13px}
.blue{color:var(--blue)}
section.s{padding:72px 0}
label.f{display:grid;gap:7px;font-size:13.5px;font-weight:600}
.in{width:100%;height:50px;background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:0 16px;font-size:16px}
textarea.in{height:auto;min-height:100px;padding:14px 16px;resize:vertical}
.in:focus{outline:none;border-color:#0f1412;background:#fff}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:9px 16px;border-radius:999px;box-shadow:inset 0 0 0 1px #d4d4d4;font-size:14px;font-weight:500}
.chip input:checked+span{background:#0f1412;color:#fff;box-shadow:none}.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.err{color:#b42318;font-size:14px;font-weight:600;min-height:20px;margin:0}
.blk{padding:40px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.blk>.k{display:grid;gap:6px;align-content:start}.blk>.k b{font-size:13px;font-weight:600;color:var(--blue)}.blk>.k span{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
@media(max-width:860px){header.h .in{padding:0 18px;grid-template-columns:auto 1fr}.nl{display:none}.wm span{display:none}.wrap,.narrow{padding:0 18px}.g2,.g3{grid-template-columns:1fr}.blk{grid-template-columns:1fr;gap:16px}}
.card{border:1px solid var(--line);border-radius:18px;background:#fff}.pad{padding:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill.k{background:#0f1412;color:#fff}.pill.b{background:#e8eefb;color:var(--blue)}.pill.g{background:#e8f4ec;color:var(--ok)}
.ok{color:var(--ok);font-weight:600}.wa{color:var(--warn);font-weight:600}
.qty{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #cfcfcf;background:#fff;cursor:pointer;font-size:17px;line-height:1}
.qty output{min-width:26px;text-align:center}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tl div{display:grid;gap:8px;font-size:13px;color:#8a8f8c}.tl i{height:3px;border-radius:2px;background:#e3e3e3}
.tl .on{color:var(--ink);font-weight:600}.tl .on i{background:var(--ink)}.tl .now{color:var(--blue);font-weight:600}.tl .now i{background:var(--blue)}
@media(max-width:700px){.tl{grid-template-columns:repeat(3,1fr)}}
.hero{position:relative;min-height:calc(100svh - 104px);background:#111;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.15) 60%)}
.hero .wrap{position:relative;z-index:1;padding-bottom:72px;width:100%}
.vc{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.vc .ph{aspect-ratio:16/10;background:var(--soft);display:flex;align-items:center;justify-content:center}
.vc .ph span{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;letter-spacing:-.02em}
.vc .b{padding:18px 20px 20px;display:grid;gap:6px;flex:1}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 10px 10px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 10px 14px 0;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.sum{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px}.sum span:first-child{color:var(--muted)}
.notice{border-radius:14px;padding:16px 18px;background:#e8eefb;color:#0b2a63}
.modal{position:fixed;inset:0;background:rgba(15,20,18,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal>div{background:#fff;border-radius:22px;width:min(980px,100%);max-height:92vh;overflow:auto;padding:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1412;color:#fff;padding:12px 20px;border-radius:999px;z-index:80;font-weight:600;font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media(max-width:960px){.split{grid-template-columns:1fr}}
footer.f{border-top:1px solid var(--line);padding:28px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="bar"><span>Test drive · sample vendors · sign-in is simulated</span><a href="#" id="reset">Start over</a></div>
<div id="app"></div>
<script>
(() => {
const LOGO = '/assets/culinary-express-logo.png';
const MEDIA = 'https://www.culinary.express/assets/videos/brand';
const CAL = 'https://calendly.com/theexpress';
const REVIEWS = 'https://share.google/562GL0SKiDTD7gPY2';
const TYPES = ['Restaurant', 'Event Venue', 'Farm', 'Winery', 'Bakery + Desserts', 'Coffee + Espresso', 'Bar + Drinks', 'Rentals', 'Entertainment'];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(n).toLocaleString();
const toast = m => { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); };
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const initials = n => String(n || '?').split(/\s+/).filter(w => !/^sample$/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();

let SESS = store.get('ce-sess', null), ADM = (() => { try { return sessionStorage.getItem('ce-adm') || ''; } catch { return ''; } })();
let LIVE = [], ME = null, AD = null, D = store.get('ce-draft', null), PARAM = null, PEND = null, INV = null, VD = null;
const blankDraft = () => ({ inq: { title: '', type: 'Full event', guaranteed: '', date: '', start: '18:00', end: '22:00', location: '', service: 'Buffet with service', description: '' }, gems: [], picks: [], recommend: [] });
if (!D) D = blankDraft();
const setSess = x => { SESS = x; ME = null; store.set('ce-sess', x); };
async function api(a, body = {}) {
  const r = await fetch('/api/fg?a=' + a, { method: 'POST', headers: { 'content-type': 'application/json', 'x-token': SESS?.token || '', 'x-admin-code': ADM }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'Network error. Try again.' }));
  if (!r.ok) { if (r.status === 401 && !a.startsWith('admin')) setSess(null); throw new Error(j.error || 'Something went wrong'); }
  return j;
}
const loadLive = async () => { try { LIVE = (await api('vendors')).vendors || []; } catch { LIVE = []; } };
const loadMe = async () => (ME = await api('me'));
const isVendor = () => !!SESS?.account?.vendorId;

// Sample directory: placeholders for testing only
const SAMPLES = [
  ['lib-1', 'Sample Taquería', 'Restaurant', 'Mission', [['Carnitas tray', 'Salsa verde, tortillas', 95, 'per tray (10)'], ['Vegetable enchiladas', 'Mole, queso fresco', 85, 'per tray (10)'], ['Rice + beans', '', 45, 'per tray (10)'], ['Chips + three salsas', '', 30, 'per tray (10)']]],
  ['lib-2', 'Sample Trattoria', 'Restaurant', 'North Beach', [['Lasagna', 'Bolognese, béchamel', 110, 'per tray (12)'], ['Caesar salad', '', 55, 'per tray (12)'], ['Focaccia', 'Rosemary, sea salt', 25, 'per tray (12)']]],
  ['lib-3', 'Sample Bakery', 'Bakery + Desserts', 'Inner Sunset', [['Churros', 'Chocolate dip', 36, 'per dozen'], ['Tres leches', '', 70, 'per half sheet'], ['Cookie platter', 'Assorted', 30, 'per dozen']]],
  ['lib-4', 'Sample Espresso Cart', 'Coffee + Espresso', 'Citywide', [['Espresso cart service', 'Barista-made drinks, 3 hours', 450, 'per event']]],
  ['lib-5', 'Sample Wine Bar', 'Bar + Drinks', 'Hayes Valley', [['Wine + beer package', '3 hours', 28, 'per person']]],
  ['lib-6', 'Sample Valley Farm', 'Farm', 'Sonoma', [['Grazing board', 'Farm cheeses, fruit', 180, 'per board (20)']]]
].map(([id, name, type, hood, items]) => ({ id, name, type, hood, sample: true, items: items.map(([n, d, p, u]) => ({ n, d, p, u })) }));
const directory = () => [...LIVE, ...SAMPLES];
const vById = id => directory().find(v => v.id === id);
function eventVendors(ev) {
  const out = [], seen = new Set(), add = (v, how) => { if (v && !seen.has(v.id)) { seen.add(v.id); out.push({ ...v, how }); } };
  (ev.picks || []).forEach(id => add(vById(id), 'Your pick'));
  (ev.gems || []).filter(g => g.name).forEach((g, i) => { const L = g.inviteId && LIVE.find(v => (v.inviteIds || []).includes(g.inviteId)); if (L) add(L, 'Your local gem'); else out.push({ id: g.inviteId ? 'inv-' + g.inviteId : 'gem-' + i, name: g.name, type: g.type, items: [], how: 'Your local gem', pending: true }); });
  (ev.adminPicks || []).forEach(id => add(vById(id), 'Lead Planner pick'));
  (ev.recommend || []).forEach(t => add(directory().find(x => x.type === t && !seen.has(x.id)), 'Our local gem'));
  return out.map(v => ({ ...v, items: (v.items || []).map((it, j) => ({ ...it, id: v.id + '-' + j })) }));
}
const guests = ev => Math.max(1, parseInt(ev.inq?.guaranteed) || 40);
const hours = ev => { const t = x => { const [h, m] = String(x || '0:0').split(':').map(Number); return (h || 0) + (m || 0) / 60; }; let d = t(ev.inq?.end) - t(ev.inq?.start); if (d <= 0) d += 24; return Math.max(2, Math.round(d)); };
const STAFF = ev => { const g = guests(ev), h = hours(ev), drop = ev.inq?.type === 'Catering delivery'; return [['captain', 'Event captain', drop ? 0 : 1, h + 1, 55], ['server', 'Servers', drop ? 0 : Math.ceil(g / (ev.inq?.service === 'Plated dinner' ? 10 : 15)), h, 40], ['bartender', 'Bartender', eventVendors(ev).some(v => v.type === 'Bar + Drinks') ? Math.ceil(g / 50) : 0, Math.max(2, h - 1), 45], ['barista', 'Barista', eventVendors(ev).some(v => v.type === 'Coffee + Espresso') ? 1 : 0, 3, 40], ['driver', 'Driver', 1, 2, 35], ['setup', 'Setup + breakdown', drop ? 0 : Math.ceil(g / 25), 3, 35]].map(([k, n, q, h2, r]) => ({ k, n, q, h: h2, r })); };
const MAT = ev => { const g = guests(ev), t = Math.ceil(g / 8) + 2; return [['tables', 'Round tables (60")', t, 12], ['chairs', 'Chairs', g, 4], ['linens', 'Linens + napkins', t, 14], ['plates', 'Plates', g * 2, 1], ['cutlery', 'Cutlery sets', g, 1.5], ['glass', 'Glassware', g * 2, 1], ['chafing', 'Chafing dishes + fuel', /Buffet/.test(ev.inq?.service || '') ? Math.max(4, Math.ceil(g / 8)) : 0, 18]].map(([k, n, q, p]) => ({ k, n, q, p })); };
const staffOf = ev => { const d = Object.fromEntries(STAFF(ev).map(r => [r.k, { q: r.q, h: r.h }])); return { ...d, ...(ev.staff || {}) }; };
const matOf = ev => { const d = Object.fromEntries(MAT(ev).map(m => [m.k, { q: m.q, src: 'ce' }])); return { ...d, ...(ev.mat || {}) }; };
function totals(ev) { let food = 0, items = 0; eventVendors(ev).forEach(v => v.items.forEach(i => { const q = ev.sel?.[i.id] || 0; food += q * i.p; if (q) items++; }));
  const st = staffOf(ev), mt = matOf(ev); let labor = 0, people = 0; STAFF(ev).forEach(r => { const s = st[r.k]; labor += s.q * s.h * r.r; people += s.q; });
  let mat = 0; MAT(ev).forEach(m => { const s = mt[m.k]; if (s.src === 'ce') mat += s.q * m.p; }); const sub = food + labor + mat; return { food, items, labor, people, mat, total: Math.max(0, sub - (sub ? 200 : 0)) }; }
const STAGES = ['Inquiry', 'Discovery call', 'Menus', 'Quote', 'Approved', 'Booked'];
const stageOf = ev => { const q = ev.quote?.status; if (q === 'in_progress' || q === 'completed') return 5; if (q === 'approved') return 4; if (q === 'quoted' || q === 'requested') return 3; if (ev.booked) return 2; return 1; };
const statusText = ev => { const q = ev.quote?.status; return q === 'completed' ? 'Completed' : q === 'in_progress' ? 'In progress' : q === 'approved' ? 'Approved' : q === 'quoted' ? 'Quote ready' : q === 'requested' ? 'Building your quote' : ev.booked ? 'Choose your menus' : 'Book your discovery call'; };

// ---------- chrome ----------
function header(mode) {
  const left = mode === 'admin' ? [['admin', 'Dispatch'], ['admin/vendors', 'Vendors']] : mode === 'vendor' ? [['vendor', 'My page'], ['vendor/orders', 'Orders']] : [['', 'Home'], ['gems', 'Local gems'], ...(SESS && !isVendor() ? [['events', 'My events']] : [])];
  const cur = location.hash.replace(/^#\/?/, '');
  const right = mode === 'admin' ? `<button class="u sml" type="button" id="out">Leave admin</button>` : SESS ? `<span class="sml m" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(SESS.account.name || SESS.account.email)}</span><button class="u sml" type="button" id="out">Sign out</button>${isVendor() ? '' : `<a class="btn dk sm" href="#/start">New event</a>`}` : `<a class="u sml" href="#/signin">Sign in</a><a class="btn dk sm" href="#/start">Let’s Begin ↗</a>`;
  return `<header class="h"><div class="in"><nav class="nl" aria-label="Main">${left.map(([h, t]) => `<a href="#/${h}" class="${cur === h ? 'on' : ''}">${t}</a>`).join('')}</nav><a class="wm" href="#/"><img src="${LOGO}" alt="">${mode === 'admin' ? '<span>Super Admin</span>' : '<span>Cülinary Expréss</span>'}</a><div class="hr">${right}</div></div></header>`;
}
const footer = () => `<footer class="f"><span>© Cülinary Expréss · Order Your Moment</span><span><a href="mailto:plan@culinary.express">plan@culinary.express</a> · <a href="${REVIEWS}" target="_blank" rel="noopener">★ Google Reviews</a> · <a href="#/join/vendor">For vendors</a> · <a href="#/admin">Super Admin</a></span></footer>`;
const page = (mode, body) => `${header(mode)}<main>${body}</main>${footer()}`;
const V = {}, H = {};

V[''] = () => page('client', `
<section class="hero"><video src="${MEDIA}/hero-reel.mp4" poster="${MEDIA}/hero-reel.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
 <div class="wrap"><p class="caps" style="color:rgba(255,255,255,.8);margin:0 0 18px">Cülinary Expréss · Fíeld Güide</p><h1 class="d1">Order Your<br><span style="color:var(--sky)">Moment</span>.</h1>
 <p style="font-size:20px;color:rgba(255,255,255,.88);max-width:560px;margin:22px 0 0">Literally any restaurant you want, brought to any venue, staffed and run by us.</p>
 <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:30px"><a class="btn wt" href="#/start">Start your inquiry ↗</a><a class="btn ln" style="color:#fff" href="#/gems">Browse local gems</a></div></div></section>
<section class="s"><div class="wrap"><p class="caps m" style="margin:0">How it works</p><h2 class="d2" style="margin-top:14px;max-width:800px">Your favorite vendors. <span style="font-weight:300">We run the service.</span></h2>
 <div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:44px">${[['01', 'Send your inquiry', 'Your event and the local gems you love.'], ['02', 'Discovery call', 'Twenty minutes with your Lead Planner.'], ['03', 'Choose your menus', 'Order straight from each vendor’s menu.'], ['04', 'Approve your quote', 'We add staff and materials. You approve.']].map(([n, t, d]) => `<div style="border-top:1px solid var(--ink);padding-top:18px"><b class="blue sml">${n}</b><h3 class="d3" style="margin:10px 0 8px">${t}</h3><p class="m" style="margin:0">${d}</p></div>`).join('')}</div>
 <a class="btn dk" href="#/start" style="margin-top:44px">Start your inquiry</a></div></section>`);

let FILTER = 'All';
const vendorCards = sel => { const list = directory().filter(v => FILTER === 'All' || v.type === FILTER);
  return `<div class="g3">${list.map(v => `<article class="vc"><div class="ph"><span>${esc(initials(v.name))}</span></div><div class="b"><span class="tag">${esc(v.type)}${v.sample ? ' · Sample' : ''}</span><h3 style="font-size:20px;letter-spacing:-.02em">${esc(v.name)}</h3><span class="m sml">${esc(v.hood || '')} · ${v.items.length} menu items</span>
   ${sel ? `<button class="btn ${D.picks.includes(v.id) ? 'dk' : 'ln'} sm" type="button" data-pick="${v.id}" style="margin-top:10px;justify-self:start">${D.picks.includes(v.id) ? 'Added ✓' : 'Add to my event'}</button>` : ''}</div></article>`).join('')}</div>`; };
const filterChips = () => `<div class="chips" role="radiogroup" aria-label="Filter" style="margin:28px 0">${['All', ...TYPES].map(t => `<label class="chip"><input type="radio" name="flt" value="${esc(t)}" ${FILTER === t ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>`;
V['gems'] = () => page(isVendor() ? 'vendor' : 'client', `<section class="s"><div class="wrap"><p class="caps m" style="margin:0">The Fíeld Güide</p><h1 class="d2" style="margin-top:14px">Local gems.</h1><p class="lead">Restaurants, farms, bakeries, espresso carts and more. Add any of them to your event, or bring your own.</p>${filterChips()}<div id="dir">${vendorCards(!isVendor())}</div>
