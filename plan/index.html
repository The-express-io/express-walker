<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cülinary Expréss · Let’s Begin (test)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1412;--muted:#5a5f5c;--line:#e6e6e6;--soft:#f4f4f4;--blue:#0047ab;--blue2:#00337d;--sky:#4f7dff;--ok:#1d7a46;--warn:#9a5b00}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 16px/1.55 Manrope,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.bar{height:32px;background:#0f1412;color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:0 12px;text-align:center}
.bar a{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.4)}
header.h{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.h .in{height:72px;padding:0 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nl{display:flex;gap:28px}.nl a{font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:4px 0;border-bottom:1px solid transparent}.nl a:hover,.nl a.on{border-color:currentColor}
.wm{display:flex;align-items:center;gap:12px;text-decoration:none}.wm img{width:34px;height:34px;border-radius:50%;background:#fff}.wm span{font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.hr{justify-self:end;display:flex;align-items:center;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:999px;font-size:14.5px;font-weight:600;text-decoration:none;border:0;cursor:pointer;white-space:nowrap;transition:background .2s,opacity .2s}
.dk{background:#0f1412;color:#fff}.dk:hover{background:#2b302d}
.bl{background:var(--blue);color:#fff}.bl:hover{background:var(--blue2)}
.wt{background:#fff;color:#0f1412}.wt:hover{background:#ececec}
.ln{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}.ln:hover{background:rgba(0,0,0,.04)}
.sm{min-height:36px;padding:0 16px;font-size:13px}
.caps{font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
button:disabled{opacity:.4;cursor:not-allowed}
.u{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(0,0,0,.25)}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}.narrow{max-width:860px;margin:0 auto;padding:0 40px}
h1,h2,h3{font-weight:600;letter-spacing:-.04em;margin:0}
.d1{font-size:clamp(48px,7vw,104px);line-height:.95}.d2{font-size:clamp(34px,4.6vw,60px);line-height:1}.d3{font-size:26px;letter-spacing:-.03em}
.lead{font-size:19px;color:var(--muted);margin:14px 0 0;max-width:620px}
.m{color:var(--muted)}.sml{font-size:13px}.blue{color:var(--blue)}
section.s{padding:72px 0}
label.f{display:grid;gap:7px;font-size:13.5px;font-weight:600}
.in{width:100%;height:50px;background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:0 16px;font-size:16px}
textarea.in{height:auto;min-height:100px;padding:14px 16px;resize:vertical}
.in:focus{outline:none;border-color:#0f1412;background:#fff}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:9px 16px;border-radius:999px;box-shadow:inset 0 0 0 1px #d4d4d4;font-size:14px;font-weight:500}
.chip input:checked+span{background:#0f1412;color:#fff;box-shadow:none}.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.tchip{padding:8px 15px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1px #d4d4d4;background:#fff;font-size:13.5px;font-weight:500;cursor:pointer}
.tchip.on{background:#0f1412;color:#fff;box-shadow:none}
.addchip{height:36px;border-radius:999px;border:1.5px dashed #bdbdbd;background:#fff;padding:0 14px;font-size:13.5px;width:170px}
.addchip:focus{outline:none;border-color:#0f1412;border-style:solid}
.err{color:#b42318;font-size:14px;font-weight:600;min-height:20px;margin:0}
.blk{padding:40px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.blk>.k{display:grid;gap:6px;align-content:start}.blk>.k b{font-size:13px;font-weight:600;color:var(--blue)}.blk>.k span{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.card{border:1px solid var(--line);border-radius:18px;background:#fff}.pad{padding:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill.k{background:#0f1412;color:#fff}.pill.b{background:#e8eefb;color:var(--blue)}.pill.g{background:#e8f4ec;color:var(--ok)}
.ok{color:var(--ok);font-weight:600}.wa{color:var(--warn);font-weight:600}
.qty{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #cfcfcf;background:#fff;cursor:pointer;font-size:17px;line-height:1}
.qty output{min-width:26px;text-align:center}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tl div{display:grid;gap:8px;font-size:13px;color:#8a8f8c}.tl i{height:3px;border-radius:2px;background:#e3e3e3}
.tl .on{color:var(--ink);font-weight:600}.tl .on i{background:var(--ink)}.tl .now{color:var(--blue);font-weight:600}.tl .now i{background:var(--blue)}
.hero{position:relative;min-height:62vh;background:#111;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.15) 65%)}
.hero .wrap{position:relative;z-index:1;padding-bottom:64px;width:100%}
.role{display:flex;flex-direction:column;gap:14px;padding:28px;border:1px solid var(--line);border-radius:22px;text-decoration:none;background:#fff;transition:border-color .2s,transform .2s}
.role:hover{border-color:var(--ink);transform:translateY(-2px)}
.role ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}.role li::before{content:"— ";color:var(--blue)}
.role .go{margin-top:auto;align-self:flex-start}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 10px 10px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 10px 14px 0;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.sum{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px}.sum span:first-child{color:var(--muted)}
.notice{border-radius:14px;padding:16px 18px;background:#e8eefb;color:#0b2a63}
.modal{position:fixed;inset:0;background:rgba(15,20,18,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal>div{background:#fff;border-radius:22px;width:min(980px,100%);max-height:92vh;overflow:auto;padding:28px}
.modal.n>div{width:min(560px,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1412;color:#fff;padding:12px 20px;border-radius:999px;z-index:80;font-weight:600;font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
footer.f{border-top:1px solid var(--line);padding:28px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.vcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.vcard .ph{aspect-ratio:16/10;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.vcard .ph img{width:100%;height:100%;object-fit:cover}
.vcard .ph span{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.vcard .b{padding:16px 18px 18px;display:grid;gap:6px;flex:1}

/* Onboarding (Figma: dark side panel + form) */
.ob{display:grid;grid-template-columns:400px minmax(0,1fr);min-height:calc(100vh - 32px)}
.ob .sd{align-self:start;background:#0f1412;color:#fff;padding:40px;display:flex;flex-direction:column;gap:40px;position:sticky;top:0;height:calc(100vh - 32px);overflow:auto}
.ob .sd .wm img{background:#fff}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;font-size:14px;color:rgba(255,255,255,.45);padding:7px 0}
.steps li i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.steps li.done{color:rgba(255,255,255,.8)}.steps li.done i{background:#fff}
.steps li.now{color:#fff;font-weight:600}.steps li.now i{background:var(--sky);box-shadow:0 0 0 4px rgba(79,125,255,.25)}
.sd ul.pts{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:rgba(255,255,255,.75)}.sd ul.pts li::before{content:"— ";color:var(--sky)}
.ob .mn{padding:72px 80px 96px;max-width:920px;width:100%}
.tcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tc{position:relative;cursor:pointer}.tc input{position:absolute;opacity:0}
.tc span{display:grid;gap:2px;padding:16px 18px;border-radius:14px;box-shadow:inset 0 0 0 1px #d4d4d4;height:100%}
.tc span b{font-weight:600}.tc span small{font-size:12.5px;color:var(--muted)}
.tc input:checked+span{background:#0f1412;color:#fff;box-shadow:none}.tc input:checked+span small{color:rgba(255,255,255,.7)}
.tc input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.mc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mc .tc input:checked+span{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px #0f1412}.mc .tc input:checked+span small{color:var(--muted)}
fieldset.fs{border:0;margin:0;padding:0;display:grid;gap:10px}fieldset.fs legend{font-size:13.5px;font-weight:600;padding:0;margin-bottom:10px}

/* Figma app shell (vendor + Super Admin dashboards) */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 32px);font-family:Montserrat,system-ui,sans-serif;background:#f7f7f7}
.app .side{background:#1e1e1e;color:#fff;padding:28px 0;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 32px);overflow:auto}
.app .lg{display:flex;align-items:center;gap:10px;padding:0 24px 36px;color:#fff;text-decoration:none;font-size:17px;font-weight:500}.app .lg img{width:30px;height:30px;border-radius:50%;background:#fff}
.app .side nav{display:flex;flex-direction:column}
.app .grp{padding:16px 24px 4px;font-size:15px;font-weight:600}
.app a.it{display:block;padding:9px 24px;font-size:15px;font-weight:500;color:rgba(255,255,255,.5);text-decoration:none;border-left:2px solid transparent}
.app a.it.sub{padding:5px 24px 5px 38px;font-size:13.5px}
.app a.it:hover{color:#fff}.app a.it.on{color:#fff;font-weight:600;border-left-color:#fff}
.app .out{margin-top:auto;padding:24px 24px 0}.app .out button{background:none;border:0;color:#fff;font:600 15px Montserrat,system-ui,sans-serif;cursor:pointer;padding:0}
.app .cnt{padding:32px 36px 56px;min-width:0}
.app .cnt>section{padding-left:0!important;padding-right:0!important;background:none!important}.app .cnt>section.s{padding:0}
.bed .mc{grid-template-columns:1fr}.bed .tc span{padding:12px 14px}.bed .tcs{grid-template-columns:1fr 1fr}.app .wrap,.app .narrow{max-width:none;padding:0}
.app .d2{font:600 26px/1.15 Montserrat,system-ui,sans-serif;letter-spacing:-.01em}.app .d3{font:600 18px Montserrat,system-ui,sans-serif}.app .lead{font-size:15px}.app p.caps.m{display:none}
.app .btn,.ob .btn{border-radius:6px;font-family:Montserrat,system-ui,sans-serif;min-height:40px;font-size:13.5px}.app .card{border-radius:10px}
.ph1{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph1 h1{font:600 24px Montserrat,system-ui,sans-serif;letter-spacing:-.01em}.ph1 p{margin:4px 0 0;color:#6b6b6b;font-size:15px}
.fb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:6px;font:600 13.5px Montserrat,system-ui,sans-serif;border:1px solid #1e1e1e;background:#1e1e1e;color:#fff;cursor:pointer;text-decoration:none;white-space:nowrap}
.fb:hover{background:#000}.fb.o{background:#fff;color:#1e1e1e;border-color:#dcdcdc}.fb.o:hover{border-color:#1e1e1e}.fb svg{width:15px;height:15px}
.fsearch{height:38px;width:240px;border:1px solid #dcdcdc;border-radius:6px;padding:0 14px;font:14px Montserrat,system-ui,sans-serif;background:#fff}.fsearch:focus{outline:none;border-color:#1e1e1e}
.fpanel{background:#fff;border:1px solid #e6e6e6;border-radius:10px;overflow:hidden}
.fsub{border-right:1px solid #ececec;padding:18px 14px;display:flex;flex-direction:column;gap:2px}
.fsub .t{font-size:13.5px;color:#6b6b6b;padding:0 10px 8px}
.fsub button{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;font:500 14.5px Montserrat,system-ui,sans-serif;cursor:pointer;color:#1e1e1e;white-space:nowrap}
.fsub button.on{background:#ececec}.fsub button:hover:not(.on){background:#f5f5f5}
/* Builder */
.seg{display:inline-flex;background:#f0f0f0;border-radius:6px;padding:3px}.seg button{border:0;background:none;border-radius:4px;padding:6px 12px;font:600 13px Montserrat,system-ui,sans-serif;cursor:pointer;color:#6b6b6b}.seg button.on{background:#fff;color:#1e1e1e;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bgrid{display:grid;grid-template-columns:180px 360px minmax(0,1fr);height:calc(100vh - 170px);min-height:560px}
.bed{padding:22px;display:grid;gap:18px;align-content:start;border-right:1px solid #ececec;overflow:auto}
.bpv{background:#efefef;padding:18px;overflow:auto}
.pvf{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.08);margin:0 auto;width:1120px}
.pvf.phone{width:390px;border-radius:22px}
.pvf a{pointer-events:none}
.mgrid{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 170px)}
.pcards{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
.pc{display:grid;grid-template-columns:130px minmax(0,1fr);gap:22px;border:1px solid #e6e6e6;border-radius:8px;padding:18px;background:#fff;font-family:Montserrat,system-ui,sans-serif}
.pc .im{aspect-ratio:1;border-radius:4px;background:#d9d9d9;overflow:hidden}.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc h3{font:600 16px Montserrat,system-ui,sans-serif;letter-spacing:0}.pc p{margin:6px 0 0;font-size:14px;line-height:1.45;color:#6b6b6b}
.pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.price{font-family:'Playfair Display',Georgia,serif;font-size:22px;color:#1e1e1e}.price small{font-family:Montserrat,system-ui,sans-serif;font-size:12.5px;color:#6b6b6b;margin-left:6px}
.ic{border:0;background:none;cursor:pointer;padding:4px;color:#1e1e1e}.ic svg{width:20px;height:20px;display:block}
.mempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:420px;text-align:center;font-family:Montserrat,system-ui,sans-serif}.mempty b{font-size:20px;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--soft)}.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.cover{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--soft)}.cover img{width:100%;height:100%;object-fit:cover}
.drop{border:0;border-radius:8px;background:#f3f3f5;padding:22px;text-align:center;cursor:pointer;font:14px Montserrat,system-ui,sans-serif;color:#6b6b6b;width:100%}
.drop small{display:block;font-size:11.5px;color:#9a9a9a;margin-top:2px}.drop:hover{color:#1e1e1e;background:#ececee}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.irow .t{width:52px;height:52px;border-radius:6px;background:#d9d9d9;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}.irow .t img{width:100%;height:100%;object-fit:cover}
.tog{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.tog input{width:20px;height:20px;accent-color:#1e1e1e}
.hint{border-radius:8px;padding:12px 14px;background:#f3f3f5;color:#3a3a3a;font-size:13.5px}
.fm{font-family:Montserrat,system-ui,sans-serif}.fm label.f{font-weight:600;font-size:14px}.fm .in{background:#f3f3f5;border-radius:8px;height:44px;font-size:15px}.fm textarea.in{height:auto}
.catbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f3f3f5;border-radius:8px;padding:6px}
.catbox label{cursor:pointer}.catbox input{position:absolute;opacity:0}.catbox span{display:inline-block;padding:6px 10px;border-radius:4px;font-size:12.5px;color:#6b6b6b}
.catbox input:checked+span{background:#fff;color:#1e1e1e;box-shadow:inset 0 0 0 1px #1e1e1e}.catbox input:focus-visible+span{outline:2px solid var(--blue)}
.pfx{display:flex;background:#f3f3f5;border-radius:8px;overflow:hidden}.pfx b{display:flex;align-items:center;padding:0 12px;background:#e6e6e8;color:#6b6b6b;font-weight:500}.pfx .in{border-radius:0}

/* Vendor page (public page + builder preview): Lead Planner reference design + dd.nyc / memory2 flair */
.vpw{container-type:inline-size}
.vp{font-family:Montserrat,system-ui,sans-serif;background:#fff;color:#1e1e1e;overflow:hidden}
.bdg{display:inline-block;padding:5px 12px;border-radius:999px;font:600 12px Montserrat,system-ui,sans-serif}
.vp .sf{font-family:'Instrument Serif','Playfair Display',Georgia,serif;font-weight:400}
.op{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:44px;padding:0 26px;border-radius:999px;border:1px solid #1e1e1e;background:transparent;color:#1e1e1e;font:500 11.5px Montserrat,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
.op:hover{background:#1e1e1e;color:#fff}.op img{width:26px;height:auto;transition:filter .25s}.op:hover img{filter:invert(1)}
.op.k{background:#1e1e1e;color:#fff}.op.k:hover{background:#000}.op.w{border-color:rgba(255,255,255,.85);color:#fff}.op.w:hover{background:#fff;color:#1e1e1e}

async function toJpeg(file) {
  const url = URL.createObjectURL(file);
  try { const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .82); } finally { URL.revokeObjectURL(url); }
}

// Binds every editor control inside root. changed(): something edited; rebuild(): structure changed, re-render the controls.
function bindEditor(root, changed, rebuild) {

    if (f === 'type' && x.value !== VD.type) { const old = ti(VD.type).cats; if (!(VD.cats || []).length || JSON.stringify(VD.cats) === JSON.stringify(old)) VD.cats = [...ti(x.value).cats]; VD.type = x.value; changed(); rebuild(); return; }
    VD[f] = x.value; changed(); });
  root.querySelectorAll('[name=mode]').forEach(x => x.onchange = () => { VD.mode = x.value; changed(); });
  root.querySelectorAll('[name=accent]').forEach(x => x.onchange = () => { VD.accent = x.value; changed(); });
  root.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { const f = b.dataset.chip, v = b.dataset.val; VD[f] = sel(VD[f], v) ? VD[f].filter(x => x !== v) : [...(VD[f] || []), v]; changed(); rebuild(); });
  root.querySelectorAll('[data-addchip]').forEach(x => x.onkeydown = e => { if (e.key !== 'Enter') return; e.preventDefault(); const v = x.value.trim(), f = x.dataset.addchip; if (v && !sel(VD[f], v)) { VD[f] = [...(VD[f] || []), v]; changed(); rebuild(); } });
  root.querySelectorAll('[data-sec]').forEach(x => x.onchange = () => { VD.sections = { ...(VD.sections || {}), [x.dataset.sec]: x.checked }; changed(); });
  root.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => { const k = b.dataset.up, urls = await pickImages(k === 'gallery'); if (!urls.length) return; if (k === 'cover') VD.cover = urls[0]; else VD.gallery = [...(VD.gallery || []), ...urls].slice(0, 9); changed(); rebuild(); });
  root.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { VD[b.dataset.rm] = ''; changed(); rebuild(); });
  root.querySelectorAll('[data-rmg]').forEach(b => b.onclick = () => { VD.gallery.splice(+b.dataset.rmg, 1); changed(); rebuild(); });

  const stepper = (attr, k, f, val) => locked ? val : `<span class="qty"><button type="button" aria-label="Fewer" ${attr}="${k}" ${f ? `data-f="${f}"` : ''} data-d="-1">−</button><output>${val}</output><button type="button" aria-label="More" ${attr}="${k}" ${f ? `data-f="${f}"` : ''} data-d="1">+</button></span>`;
  return page('admin', `<section style="padding:48px 0 28px;background:var(--soft)"><div class="wrap"><a class="u sml" href="#/admin">← Dispatch</a><div style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-top:16px"><div><h1 class="d2">${esc(ev.inq?.title || '')}</h1><p class="m" style="margin:10px 0 0">${esc(ev.ownerName || '')} · <a href="mailto:${esc(ev.owner)}">${esc(ev.owner)}</a>${ev.ownerPhone ? ` · <a href="tel:${esc(ev.ownerPhone)}">${esc(ev.ownerPhone)}</a>` : ''}</p></div><span class="pill k">${adminStatus(ev)}</span></div>
   <div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:24px">${[['Date', `${ev.inq?.date || ''} · ${ev.inq?.start || ''}`], ['Guests', guests(ev)], ['Type', ev.inq?.type], ['Service', ev.inq?.service], ['Location', ev.inq?.location], ['Discovery call', ev.booked ? 'Booked' : 'Not yet'], ['Wants us to recommend', (ev.recommend || []).join(', ') || 'Nothing']].map(([k, v]) => `<div><span class="tag">${k}</span><div style="font-weight:600">${esc(v)}</div></div>`).join('')}</div>${ev.inq?.description ? `<p class="m" style="margin:16px 0 0;max-width:800px">“${esc(ev.inq.description)}”</p>` : ''}</div></section>
  <section style="padding:32px 0 72px"><div class="wrap split"><div style="display:grid;gap:18px">
   <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 class="d3">Vendors + menus</h2>${locked ? '' : `<select class="in" id="addv" style="height:40px;width:auto" aria-label="Add a vendor"><option value="">+ Add a vendor</option>${AD.vendors.filter(v => !vs.some(x => x.id === v.id)).map(v => `<option value="${v.id}">${esc(v.name)} · ${esc(v.type)}${v.status === 'live' ? '' : ' (draft)'}</option>`).join('')}</select>`}</div>
    ${vs.map(v => { const its = v.items.filter(x => ev.sel?.[x.id]); return `<div style="border-top:1px solid var(--line);padding-top:16px;margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b style="font-weight:600">${esc(v.name)}</b> <span class="pill ${v.how.startsWith('Your') ? 'k' : 'b'}" style="margin-left:6px">${esc(v.how)}</span></div>${cf(v.id)}</div>${its.length ? `<table class="tbl" style="margin-top:6px"><tbody>${its.map(x => `<tr><td>${esc(x.n)} <span class="m sml">${esc(x.u)}</span></td><td>× ${ev.sel[x.id]}</td><td style="text-align:right">${money(x.p * ev.sel[x.id])}</td></tr>`).join('')}</tbody></table>` : `<p class="m sml" style="margin:6px 0 0">${v.pending ? 'Invited · menu pending' : 'No items chosen yet'}</p>`}</div>`; }).join('') || '<p class="m">No vendors yet.</p>'}
    ${inv.length ? `<div style="border-top:1px solid var(--line);margin-top:18px;padding-top:14px"><span class="tag">Invites</span>${inv.map(x => `<div class="row"><span>${esc(x.gemName)} <span class="m sml">· ${x.status === 'joined' ? 'joined' : 'invite sent'}</span></span><button class="u sml" type="button" data-copy="${location.origin}${location.pathname}#/vendor/join/${x.id}">Copy invite link</button></div>`).join('')}</div>` : ''}</div>
   <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="d3">Staffing</h2>${cf('staff')}</div><table class="tbl" style="margin-top:10px"><thead><tr><th>Role</th><th>People</th><th>Hours</th><th style="text-align:right">Total</th></tr></thead><tbody>${STAFF(ev).map(r => `<tr><td>${r.n} <span class="m sml">${money(r.r)}/hr</span></td><td>${stepper('data-s', r.k, 'q', st[r.k].q)}</td><td>${stepper('data-s', r.k, 'h', st[r.k].h)}</td><td style="text-align:right">${money(st[r.k].q * st[r.k].h * r.r)}</td></tr>`).join('')}</tbody></table></div>
   <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="d3">Materials</h2>${cf('materials')}</div><table class="tbl" style="margin-top:10px"><thead><tr><th>Item</th><th>Qty</th><th>Provided by</th></tr></thead><tbody>${MAT(ev).map(m => `<tr><td>${m.n} <span class="m sml">${money(m.p)} ea</span></td><td>${stepper('data-m', m.k, '', mt[m.k].q)}</td><td>${locked ? { ce: 'Us', have: 'Client', vendor: 'Vendor' }[mt[m.k].src] : `<select class="in" style="height:38px;width:auto" data-src="${m.k}" aria-label="${m.n} provided by">${[['ce', 'Us'], ['have', 'Client has it'], ['vendor', 'Vendor']].map(([v, l]) => `<option value="${v}" ${mt[m.k].src === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`}</td></tr>`).join('')}</tbody></table></div></div>
   <aside class="card pad" style="position:sticky;top:96px"><span class="tag">Quote</span><div style="margin-top:10px"><div class="sum"><span>Food</span><b>${money(t.food)}</b></div><div class="sum"><span>Staffing · ${t.people}</span><b>${money(t.labor)}</b></div><div class="sum"><span>Materials</span><b>${money(t.mat)}</b></div><div class="sum"><span>Coupon</span><span>−$200</span></div><div class="sum" style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px"><b>Total</b><b>${money(t.total)}</b></div></div><div style="margin-top:16px">${act}</div>${q?.status === 'requested' && !allOk ? '<p class="m sml" style="margin:10px 0 0">Confirm every vendor, staffing and materials to send.</p>' : ''}</aside></div></section>`); };
H['admin/event'] = () => { if (bindGate()) return; const ev = AD?.events.find(e => e.id === PARAM); if (!ev) return;
  const up = async b => { try { const j = await api('adminUpdate', { id: PARAM, ...b }); AD.events[AD.events.findIndex(e => e.id === PARAM)] = j.event; render(); } catch (x) { toast(x.message); } };
  $$('[data-cf]').forEach(b => b.onclick = () => up({ confirm: b.dataset.cf })); const s = $('#sendq'); if (s) s.onclick = () => up({ status: 'quoted' }); $$('[data-st]').forEach(b => b.onclick = () => up({ status: b.dataset.st }));
  const av = $('#addv'); if (av) av.onchange = () => av.value && up({ addPick: av.value });
  $$('[data-s]').forEach(b => b.onclick = () => { const st = staffOf(ev); st[b.dataset.s][b.dataset.f] = Math.max(0, st[b.dataset.s][b.dataset.f] + +b.dataset.d); up({ staff: st }); });
  $$('[data-m]').forEach(b => b.onclick = () => { const mt = matOf(ev); mt[b.dataset.m].q = Math.max(0, mt[b.dataset.m].q + +b.dataset.d); up({ mat: mt }); });
  $$('[data-src]').forEach(x => x.onchange = () => { const mt = matOf(ev); mt[x.dataset.src].src = x.value; up({ mat: mt }); });
  $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Link copied'); } catch { prompt('Copy this link', b.dataset.copy); } }); };

V['admin/vendors'] = () => needAd() || page('admin', `<div class="ph1"><div><h1>Vendor Pages</h1><p>Build pages for vendors yourself, or share the sign-up link so they build their own.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="fb o" type="button" data-copy="${location.origin}${location.pathname}#/join/vendor">Copy vendor sign-up link</button><button class="fb" type="button" id="newv">${ICON.plus} New vendor page</button></div></div>
  <div class="fgrid" style="font-family:Montserrat,system-ui,sans-serif">${AD.vendors.map(v => `<article class="dcard"><a class="dph" href="#/admin/page/${v.id}">${v.cover ? `<img src="${esc(v.cover)}" alt="">` : 'photo'}</a><div class="db"><div style="display:flex;justify-content:space-between;align-items:center;width:100%">${badge(v.type)}<span class="pill ${v.status === 'live' ? 'g' : ''}">${v.status === 'live' ? 'Live' : 'Draft'}</span></div><a class="dn" href="#/admin/page/${v.id}">${esc(v.name)}</a><span class="dm">${esc(metaOf(v))}</span><span class="dm">${(v.items || []).length} items · ${v.ownerEmail === 'admin' ? 'Built by you' : 'Built by vendor'}</span><div style="width:100%;margin-top:10px">${progBar(v)}</div>
   <a class="dbtn" href="#/admin/page/${v.id}">Edit page</a><div style="display:flex;gap:14px;margin-top:10px;font-size:13px"><a href="#/v/${v.id}" target="_blank" rel="noopener">View page ↗</a><button class="u sml" type="button" data-copy="${location.origin}${location.pathname}#/v/${v.id}">Copy link</button></div></div></article>`).join('') || `<div class="fpanel" style="grid-column:1/-1"><div class="mempty"><b>No vendor pages yet</b><button class="fb" type="button" id="newv2">${ICON.plus} New vendor page</button></div></div>`}</div>
  ${AD.invites.length ? `<h2 class="d3" style="margin-top:40px">Invites from clients</h2><div class="fpanel" style="margin-top:12px;padding:6px 20px">${AD.invites.map(x => `<div class="row" style="border-top:0;border-bottom:1px solid var(--line)"><span><b style="font-weight:600">${esc(x.gemName)}</b> <span class="m sml">· ${esc(x.type)}</span></span><span class="${x.status === 'joined' ? 'ok' : 'wa'}">${x.status === 'joined' ? 'Joined' : 'Invite sent'}</span></div>`).join('')}</div>` : ''}`);
H['admin/vendors'] = () => { if (bindGate()) return;
  const nv = () => { const m = modal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="d3">New vendor page</h2><button class="u sml" type="button" data-close>Close</button></div><form id="nvf" style="display:grid;gap:16px;margin-top:20px" novalidate><label class="f">Vendor name<input class="in" id="nv-n" placeholder="e.g. The Grove Kitchen"></label><fieldset class="fs"><legend>Vendor type</legend><div class="tcs">${TYPES.map((t, i) => `<label class="tc"><input type="radio" name="nvt" value="${esc(t)}" ${i ? '' : 'checked'}><span><b>${esc(t)}</b><small>${esc(ti(t).sub)}</small></span></label>`).join('')}</div></fieldset><p class="err" id="nv-err" role="alert"></p><div style="display:flex;justify-content:flex-end"><button class="btn dk" type="submit">Create + open builder →</button></div></form>`, mm => {
    setTimeout(() => mm.querySelector('#nv-n').focus(), 0);
    mm.querySelector('#nvf').onsubmit = async e => { e.preventDefault(); const n = mm.querySelector('#nv-n').value.trim(); if (!n) { mm.querySelector('#nv-err').textContent = 'Add a name.'; return; }
      try { const t = mm.querySelector('[name=nvt]:checked').value, { vendor } = await api('adminNewVendor', { name: n, type: t }); vendor.cats = [...ti(t).cats]; vendor.ownerEmail = 'admin'; AD.vendors.unshift(vendor); VD = clone(vendor); VTAB = 'basics'; mm.remove(); go('admin/page/' + vendor.id); } catch (x) { mm.querySelector('#nv-err').textContent = x.message; } }; }, () => {}); };
  ['#newv', '#newv2'].forEach(s => { const b = $(s); if (b) b.onclick = nv; });
  $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Link copied'); } catch { prompt('Copy this link', b.dataset.copy); } }); };
V['admin/page'] = () => { const g = needAd(); if (g) return g; const v = AD.vendors.find(x => x.id === PARAM); if (!v) return page('admin', '<section class="s"><div class="wrap"><a class="u" href="#/admin/vendors">← Vendor pages</a><p>Page not found.</p></div></section>');
  if (!VD || VD.id !== v.id) { VD = clone(v); saveState = ''; } if (!(VD.cats || []).length) VD.cats = [...ti(VD.type).cats]; VTAB = QS.get('tab') || 'basics'; return page('admin', builder('admin')); };
H['admin/page'] = () => { if (bindGate()) return; bindBuilder(); };
V['admin/crew'] = () => needAd() || page('admin', `<section class="s"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap"><div><p class="caps m" style="margin:0">Crew</p><h1 class="d2" style="margin-top:14px">Your people.</h1></div><button class="btn ln sm" type="button" data-copy="${location.origin}${location.pathname}#/join/staff">Copy crew sign-up link</button></div>
  <div class="card" style="margin-top:32px;overflow:hidden"><div class="scroll"><table class="tbl" style="min-width:760px"><thead><tr><th style="padding:18px 10px 12px 24px">Name</th><th>Roles</th><th>Experience</th><th>Available</th><th>Certifications</th><th>Onboarding</th></tr></thead><tbody>${AD.staff.map(s => `<tr><td style="padding-left:24px"><b style="font-weight:600">${esc(s.name || '—')}</b><div class="m sml">${esc(s.email)}${s.phone ? ' · ' + esc(s.phone) : ''}</div></td><td>${esc((s.roles || []).join(', ') || '—')}</td><td>${esc(s.years || '—')}</td><td>${esc((s.avail || []).join(', ') || '—')}</td><td>${esc((s.certs || []).join(', ') || '—')}</td><td><span class="pill ${s.done ? 'g' : ''}">${s.done ? 'Complete' : 'In progress'}</span></td></tr>`).join('') || '<tr><td class="m" style="padding:24px" colspan="6">No crew yet. Share the sign-up link.</td></tr>'}</tbody></table></div></div></div></section>`);
H['admin/crew'] = () => { if (bindGate()) return; $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Link copied'); } catch { prompt('Copy this link', b.dataset.copy); } }); };

function modal(html, after, onClose) { const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.innerHTML = `<div>${html}</div>`; document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', k); onClose ? onClose() : render(); }; const k = e => { if (e.key === 'Escape' && document.body.contains(m)) close(); }; document.addEventListener('keydown', k);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(); }); after && after(m); return m; }
function openCal(done) { const u = `${CAL}?hide_gdpr_banner=1&name=${encodeURIComponent(SESS?.account?.name || '')}&email=${encodeURIComponent(SESS?.account?.email || '')}`;
  const m = modal(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 class="d3">Book your discovery call</h2><button class="btn ln sm" type="button" data-close>Close</button></div><iframe src="${u}" title="Book a call on Calendly" style="width:100%;height:620px;border:0;border-radius:14px"></iframe><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn bl" type="button" id="didbook">I booked my call</button></div>`, null, () => {});
  m.querySelector('#didbook').onclick = () => { m.remove(); done(); }; }
function go(r) { location.hash = '#/' + r; }
function render() { const raw = location.hash.replace(/^#\/?/, ''); let [r, qs] = raw.split('?'); QS = new URLSearchParams(qs || ''); PARAM = null;
  for (const p of ['admin/event', 'admin/page', 'vendor/join', 'event', 'v']) if (r.startsWith(p + '/')) { PARAM = decodeURIComponent(r.slice(p.length + 1)); r = p; }
  $('#app').innerHTML = (V[r] || V[''])(); (H[r] || (() => {}))();
  const o = $('#out'); if (o) o.onclick = () => { if (r.startsWith('admin')) { ADM = ''; AD = null; store.set('ce-adm', null); } else { setSess(null); EV = null; VD = null; ST = null; } go(''); }; }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
$('#reset').onclick = e => { e.preventDefault(); setSess(null); D = blankDraft(); store.set('ce-draft', D); EV = null; VD = null; ST = null; PEND = null; INV = null; go(''); render(); };
render(); loadLive().then(() => { if (/^#\/?(start|events|event\/|guide)/.test(location.hash)) render(); });
})();
</script>
