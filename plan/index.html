<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cülinary Expréss · Let’s Begin (test)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1412;--muted:#5a5f5c;--line:#e6e6e6;--soft:#f4f4f4;--blue:#0047ab;--blue2:#00337d;--sky:#4f7dff;--ok:#1d7a46;--warn:#9a5b00}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 16px/1.55 Manrope,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.bar{height:32px;background:#0f1412;color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:0 12px;text-align:center}
.bar a{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.4)}
header.h{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.h .in{height:72px;padding:0 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nl{display:flex;gap:28px}.nl a{font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:4px 0;border-bottom:1px solid transparent}.nl a:hover,.nl a.on{border-color:currentColor}
.wm{display:flex;align-items:center;gap:12px;text-decoration:none}.wm img{width:34px;height:34px;border-radius:50%;background:#fff}.wm span{font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.hr{justify-self:end;display:flex;align-items:center;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:999px;font-size:14.5px;font-weight:600;text-decoration:none;border:0;cursor:pointer;white-space:nowrap;transition:background .2s,opacity .2s}
.dk{background:#0f1412;color:#fff}.dk:hover{background:#2b302d}
.bl{background:var(--blue);color:#fff}.bl:hover{background:var(--blue2)}
.wt{background:#fff;color:#0f1412}.wt:hover{background:#ececec}
.ln{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}.ln:hover{background:rgba(0,0,0,.04)}
.sm{min-height:36px;padding:0 16px;font-size:13px}
.caps{font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
button:disabled{opacity:.4;cursor:not-allowed}
.u{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(0,0,0,.25)}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}.narrow{max-width:860px;margin:0 auto;padding:0 40px}
h1,h2,h3{font-weight:600;letter-spacing:-.04em;margin:0}
.d1{font-size:clamp(48px,7vw,104px);line-height:.95}.d2{font-size:clamp(34px,4.6vw,60px);line-height:1}.d3{font-size:26px;letter-spacing:-.03em}
.lead{font-size:19px;color:var(--muted);margin:14px 0 0;max-width:620px}
.m{color:var(--muted)}.sml{font-size:13px}.blue{color:var(--blue)}
section.s{padding:72px 0}
label.f{display:grid;gap:7px;font-size:13.5px;font-weight:600}
.in{width:100%;height:50px;background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:0 16px;font-size:16px}
textarea.in{height:auto;min-height:100px;padding:14px 16px;resize:vertical}
.in:focus{outline:none;border-color:#0f1412;background:#fff}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:9px 16px;border-radius:999px;box-shadow:inset 0 0 0 1px #d4d4d4;font-size:14px;font-weight:500}
.chip input:checked+span{background:#0f1412;color:#fff;box-shadow:none}.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.tchip{padding:8px 15px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1px #d4d4d4;background:#fff;font-size:13.5px;font-weight:500;cursor:pointer}
.tchip.on{background:#0f1412;color:#fff;box-shadow:none}
.addchip{height:36px;border-radius:999px;border:1.5px dashed #bdbdbd;background:#fff;padding:0 14px;font-size:13.5px;width:170px}
.addchip:focus{outline:none;border-color:#0f1412;border-style:solid}
.err{color:#b42318;font-size:14px;font-weight:600;min-height:20px;margin:0}
.blk{padding:40px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.blk>.k{display:grid;gap:6px;align-content:start}.blk>.k b{font-size:13px;font-weight:600;color:var(--blue)}.blk>.k span{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.card{border:1px solid var(--line);border-radius:18px;background:#fff}.pad{padding:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill.k{background:#0f1412;color:#fff}.pill.b{background:#e8eefb;color:var(--blue)}.pill.g{background:#e8f4ec;color:var(--ok)}
.ok{color:var(--ok);font-weight:600}.wa{color:var(--warn);font-weight:600}
.qty{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #cfcfcf;background:#fff;cursor:pointer;font-size:17px;line-height:1}
.qty output{min-width:26px;text-align:center}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tl div{display:grid;gap:8px;font-size:13px;color:#8a8f8c}.tl i{height:3px;border-radius:2px;background:#e3e3e3}
.tl .on{color:var(--ink);font-weight:600}.tl .on i{background:var(--ink)}.tl .now{color:var(--blue);font-weight:600}.tl .now i{background:var(--blue)}
.hero{position:relative;min-height:62vh;background:#111;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.15) 65%)}
.hero .wrap{position:relative;z-index:1;padding-bottom:64px;width:100%}
.role{display:flex;flex-direction:column;gap:14px;padding:28px;border:1px solid var(--line);border-radius:22px;text-decoration:none;background:#fff;transition:border-color .2s,transform .2s}
.role:hover{border-color:var(--ink);transform:translateY(-2px)}
.role ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}.role li::before{content:"— ";color:var(--blue)}
.role .go{margin-top:auto;align-self:flex-start}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 10px 10px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 10px 14px 0;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.sum{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px}.sum span:first-child{color:var(--muted)}
.notice{border-radius:14px;padding:16px 18px;background:#e8eefb;color:#0b2a63}
.modal{position:fixed;inset:0;background:rgba(15,20,18,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal>div{background:#fff;border-radius:22px;width:min(980px,100%);max-height:92vh;overflow:auto;padding:28px}
.modal.n>div{width:min(560px,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1412;color:#fff;padding:12px 20px;border-radius:999px;z-index:80;font-weight:600;font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
footer.f{border-top:1px solid var(--line);padding:28px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.vcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.vcard .ph{aspect-ratio:16/10;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.vcard .ph img{width:100%;height:100%;object-fit:cover}
.vcard .ph span{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.vcard .b{padding:16px 18px 18px;display:grid;gap:6px;flex:1}

/* Onboarding (Figma: dark side panel + form) */
.ob{display:grid;grid-template-columns:400px minmax(0,1fr);min-height:calc(100vh - 32px)}
.ob .sd{align-self:start;background:#0f1412;color:#fff;padding:40px;display:flex;flex-direction:column;gap:40px;position:sticky;top:0;height:calc(100vh - 32px);overflow:auto}
.ob .sd .wm img{background:#fff}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;font-size:14px;color:rgba(255,255,255,.45);padding:7px 0}
.steps li i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.steps li.done{color:rgba(255,255,255,.8)}.steps li.done i{background:#fff}
.steps li.now{color:#fff;font-weight:600}.steps li.now i{background:var(--sky);box-shadow:0 0 0 4px rgba(79,125,255,.25)}
.sd ul.pts{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:rgba(255,255,255,.75)}.sd ul.pts li::before{content:"— ";color:var(--sky)}
.ob .mn{padding:72px 80px 96px;max-width:920px;width:100%}
.tcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tc{position:relative;cursor:pointer}.tc input{position:absolute;opacity:0}
.tc span{display:grid;gap:2px;padding:16px 18px;border-radius:14px;box-shadow:inset 0 0 0 1px #d4d4d4;height:100%}
.tc span b{font-weight:600}.tc span small{font-size:12.5px;color:var(--muted)}
.tc input:checked+span{background:#0f1412;color:#fff;box-shadow:none}.tc input:checked+span small{color:rgba(255,255,255,.7)}
.tc input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.mc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mc .tc input:checked+span{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px #0f1412}.mc .tc input:checked+span small{color:var(--muted)}
fieldset.fs{border:0;margin:0;padding:0;display:grid;gap:10px}fieldset.fs legend{font-size:13.5px;font-weight:600;padding:0;margin-bottom:10px}

/* Builder */
.bld{display:flex;flex-direction:column;height:calc(100vh - 104px)}
.bt{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bt .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bb{flex:1;display:grid;grid-template-columns:440px minmax(0,1fr);min-height:0}
.ed{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--soft);color:var(--ink)}
.edp{padding:24px;overflow:auto;display:grid;gap:20px;align-content:start;flex:1}
.pvw{background:#e9eaea;overflow:auto;padding:24px}
.pvf{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12);margin:0 auto;max-width:1100px}
.pvf.phone{max-width:390px;border-radius:28px}
.pvf a{pointer-events:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.cover{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}.cover img{width:100%;height:100%;object-fit:cover}
.drop{border:1.5px dashed #c8c8c8;border-radius:12px;background:#fafafa;padding:22px;text-align:center;cursor:pointer;font-size:14px;color:var(--muted);width:100%}
.drop:hover{border-color:var(--ink);color:var(--ink)}
.sw{display:flex;gap:10px}.sw label{cursor:pointer;position:relative}.sw input{position:absolute;opacity:0}.sw span{display:block;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.1)}.sw input:checked+span{box-shadow:0 0 0 2px #fff,0 0 0 4px #0f1412}.sw input:focus-visible+span{outline:2px solid var(--blue);outline-offset:4px}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.irow .t{width:52px;height:52px;border-radius:10px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}.irow .t img{width:100%;height:100%;object-fit:cover}
.tog{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.tog input{width:20px;height:20px;accent-color:#0f1412}
.hint{border-radius:12px;padding:12px 14px;background:#e8eefb;color:#0b2a63;font-size:13.5px}

/* Vendor page (the public page and the builder preview share this) */
.vpw{container-type:inline-size}
.vp{--acc:#2a2c2f;background:#fff;color:var(--ink)}
.vp .cv{position:relative;min-height:540px;display:flex;align-items:flex-end;color:#fff;background:radial-gradient(120% 90% at 15% 0%,color-mix(in srgb,var(--acc) 70%,#fff 10%),var(--acc) 55%,#111 100%);overflow:hidden}
.vp .cv>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vp .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.1) 70%)}
.vp .ci{position:relative;z-index:1;padding:56px;width:100%}
.vp h1{font-size:clamp(40px,8cqw,104px);line-height:.95;letter-spacing:-.045em}
.vp .tg{font-size:clamp(17px,1.8cqw,21px);max-width:620px;margin:20px 0 0;color:rgba(255,255,255,.9)}
.vp .ca{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.vp .ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
.vp .k{color:var(--acc);margin:0 0 12px}
.vp .hl{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:40px;padding:44px 56px;border-bottom:1px solid var(--line)}
.vp .vch{display:flex;flex-wrap:wrap;gap:8px}.vp .vch span{padding:7px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 35%,#ddd);font-size:13.5px;font-weight:500}
.vp .ab{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding:64px 56px}
.vp .ab h2,.vp .mn h2,.vp .gl h2{font-size:clamp(30px,4cqw,48px);line-height:1}
.vp .ab p{font-size:18px;line-height:1.65;margin:0;max-width:680px}
.vp .mn{padding:64px 56px;background:var(--soft)}
.vp .mh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.vp .vt{display:flex;gap:6px;flex-wrap:wrap}.vp .vt button{border:0;background:#fff;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}.vp .vt button.on{background:var(--acc);color:#fff;box-shadow:none}
.vp .mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vp .mi{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;background:#fff;border-radius:16px;padding:14px;border:1px solid var(--line)}
.vp .mi .t{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}
.vp .mi .t img{width:100%;height:100%;object-fit:cover}
.vp .mi h3{font-size:18px;letter-spacing:-.02em}.vp .mi p{margin:4px 0 10px;font-size:14px;color:var(--muted)}
.vp .pr{font-weight:600}.vp .pr span{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.vp .gl{padding:64px 56px}
.vp .gg{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(140px,18cqw,240px);gap:10px;margin-top:28px}.vp .gg img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.vp .gg img:first-child{grid-column:span 2;grid-row:span 2}
.vp .bk{background:var(--acc);color:#fff;padding:64px 56px;display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.vp .bk h2{font-size:clamp(30px,4.4cqw,56px);line-height:1;max-width:640px}
.vp .bk p{margin:14px 0 0;color:rgba(255,255,255,.8);max-width:520px}
.vp .ept{border:1.5px dashed #cfcfcf;border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:14px;background:#fff}
@container (max-width:700px){
 .vp .cv{min-height:460px}.vp .ci{padding:28px 22px}
 .vp .hl{grid-template-columns:1fr;gap:26px;padding:32px 22px}
 .vp .ab{grid-template-columns:1fr;gap:16px;padding:44px 22px}.vp .ab p{font-size:16.5px}
 .vp .mn,.vp .gl{padding:44px 22px}.vp .mg{grid-template-columns:1fr}.vp .mi{grid-template-columns:84px minmax(0,1fr);gap:14px}
 .vp .gg{grid-template-columns:repeat(2,1fr)}.vp .bk{padding:44px 22px}
}
@media(max-width:960px){.split{grid-template-columns:1fr}.bld{height:auto}.bb{grid-template-columns:1fr}.ed{border-right:0;border-bottom:1px solid var(--line)}.pvw{padding:14px}.ob{grid-template-columns:1fr}.ob .sd{position:static;height:auto;padding:28px 18px;gap:24px}.ob .mn{padding:36px 18px 72px}.mc{grid-template-columns:1fr}}
@media(max-width:860px){header.h .in{padding:0 18px;grid-template-columns:auto 1fr}.nl{display:none}.wm span{display:none}.wrap,.narrow{padding:0 18px}.g2,.g3{grid-template-columns:1fr}.blk{grid-template-columns:1fr;gap:16px}.bt{padding:12px 16px}}
@media(max-width:860px){.gentry{grid-template-columns:1fr!important}.gentry>div{order:0!important}.gentry>div:first-child{min-height:220px!important}}
@media(max-width:700px){.tl{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

async function toJpeg(file) {
  const url = URL.createObjectURL(file);
  try { const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .82); } finally { URL.revokeObjectURL(url); }
}

// Binds every editor control inside root. changed(): something edited; rebuild(): structure changed, re-render the controls.
function bindEditor(root, changed, rebuild) {
  root.querySelectorAll('[data-f]').forEach(x => x.oninput = x.onchange = () => { const f = x.dataset.f;
    if (f === 'type' && x.value !== VD.type) { const old = ti(VD.type).cats; if (!(VD.cats || []).length || JSON.stringify(VD.cats) === JSON.stringify(old)) VD.cats = [...ti(x.value).cats]; VD.type = x.value; changed(); rebuild(); return; }
    VD[f] = x.value; changed(); });
  root.querySelectorAll('[name=mode]').forEach(x => x.onchange = () => { VD.mode = x.value; changed(); });
  root.querySelectorAll('[name=accent]').forEach(x => x.onchange = () => { VD.accent = x.value; changed(); });
  root.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { const f = b.dataset.chip, v = b.dataset.val; VD[f] = sel(VD[f], v) ? VD[f].filter(x => x !== v) : [...(VD[f] || []), v]; changed(); rebuild(); });
  root.querySelectorAll('[data-addchip]').forEach(x => x.onkeydown = e => { if (e.key !== 'Enter') return; e.preventDefault(); const v = x.value.trim(), f = x.dataset.addchip; if (v && !sel(VD[f], v)) { VD[f] = [...(VD[f] || []), v]; changed(); rebuild(); } });
  root.querySelectorAll('[data-sec]').forEach(x => x.onchange = () => { VD.sections = { ...(VD.sections || {}), [x.dataset.sec]: x.checked }; changed(); });
  root.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => { const k = b.dataset.up, urls = await pickImages(k === 'gallery'); if (!urls.length) return; if (k === 'cover') VD.cover = urls[0]; else VD.gallery = [...(VD.gallery || []), ...urls].slice(0, 9); changed(); rebuild(); });
  root.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { VD[b.dataset.rm] = ''; changed(); rebuild(); });
  root.querySelectorAll('[data-rmg]').forEach(b => b.onclick = () => { VD.gallery.splice(+b.dataset.rmg, 1); changed(); rebuild(); });
  root.querySelectorAll('[data-rmcat]').forEach(b => b.onclick = () => { VD.cats.splice(+b.dataset.rmcat, 1); changed(); rebuild(); });
  root.querySelectorAll('[data-addcat]').forEach(x => x.onkeydown = e => { if (e.key !== 'Enter') return; e.preventDefault(); const v = x.value.trim(); if (v && !sel(VD.cats, v)) { VD.cats = [...(VD.cats || []), v]; changed(); rebuild(); setTimeout(() => { const n = root.querySelector('[data-addcat]'); n && n.focus(); }, 0); } });
  root.querySelectorAll('[data-additem]').forEach(b => b.onclick = () => openItem(null, () => { changed(); rebuild(); }));
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openItem(+b.dataset.edit, () => { changed(); rebuild(); }));
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { VD.items.splice(+b.dataset.del, 1); changed(); rebuild(); });
  root.querySelectorAll('[data-imp]').forEach(b => b.onclick = () => { const box = root.querySelector('[data-impbox]'); box.innerHTML = `<div style="display:grid;gap:10px;margin:10px 0 14px"><label class="f">Paste your menu, one item per line: Name - price - unit<textarea class="in" data-imptx placeholder="Chicken shawarma tray - 95 - serves 10&#10;Falafel tray - 70 - serves 10"></textarea></label><div><button class="btn dk sm" type="button" data-impgo>Add items</button></div></div>`;
    box.querySelector('[data-impgo]').onclick = () => { const c = (VD.cats || [])[0] || ''; box.querySelector('[data-imptx]').value.split('\n').map(l => l.split(/\s+[-–]\s+/)).filter(p => p[0]?.trim()).forEach(([n, p, u]) => (VD.items = VD.items || []).push({ n: n.trim(), d: '', p: parseFloat(String(p || '').replace(/[^0-9.]/g, '')) || 0, u: (u || '').trim(), cat: c, img: '' })); changed(); rebuild(); }; });
}

  <div class="g3" style="margin-top:36px">${AD.vendors.map(v => `<article class="vcard"><div class="ph">${v.cover ? `<img src="${esc(v.cover)}" alt="">` : `<span>${esc(initials(v.name))}</span>`}</div><div class="b"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="tag">${esc(v.type)}</span><span class="pill ${v.status === 'live' ? 'g' : ''}">${v.status === 'live' ? 'Live' : 'Draft'}</span></div><h3 style="font-size:20px;letter-spacing:-.02em">${esc(v.name)}</h3><span class="m sml">${(v.items || []).length} items · ${v.ownerEmail === 'admin' ? 'Built by you' : 'Built by vendor'}</span><div style="margin-top:6px">${progBar(v)}</div>
   <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><a class="btn dk sm" href="#/admin/page/${v.id}">Edit page</a><a class="btn ln sm" href="#/v/${v.id}" target="_blank" rel="noopener">View ↗</a><button class="u sml" type="button" data-copy="${location.origin}${location.pathname}#/v/${v.id}">Copy link</button></div></div></article>`).join('') || `<div class="card pad" style="grid-column:1/-1;text-align:center;padding:48px"><h2 class="d3">No vendor pages yet.</h2><p class="m" style="margin:8px 0 18px">Start your first one. It takes a few minutes.</p><button class="btn bl" type="button" id="newv2">+ New vendor page</button></div>`}</div>
  ${AD.invites.length ? `<h2 class="d3" style="margin-top:48px">Invites from clients</h2><div class="card pad" style="margin-top:14px">${AD.invites.map(x => `<div class="row" style="border-top:0;border-bottom:1px solid var(--line)"><span><b style="font-weight:600">${esc(x.gemName)}</b> <span class="m sml">· ${esc(x.type)}</span></span><span class="${x.status === 'joined' ? 'ok' : 'wa'}">${x.status === 'joined' ? 'Joined' : 'Invite sent'}</span></div>`).join('')}</div>` : ''}</div></section>`);
H['admin/vendors'] = () => { if (bindGate()) return;
  const nv = () => { const m = modal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="d3">New vendor page</h2><button class="u sml" type="button" data-close>Close</button></div><form id="nvf" style="display:grid;gap:16px;margin-top:20px" novalidate><label class="f">Vendor name<input class="in" id="nv-n" placeholder="e.g. The Grove Kitchen"></label><fieldset class="fs"><legend>Vendor type</legend><div class="tcs">${TYPES.map((t, i) => `<label class="tc"><input type="radio" name="nvt" value="${esc(t)}" ${i ? '' : 'checked'}><span><b>${esc(t)}</b><small>${esc(ti(t).sub)}</small></span></label>`).join('')}</div></fieldset><p class="err" id="nv-err" role="alert"></p><div style="display:flex;justify-content:flex-end"><button class="btn dk" type="submit">Create + open builder →</button></div></form>`, mm => {
    setTimeout(() => mm.querySelector('#nv-n').focus(), 0);
    mm.querySelector('#nvf').onsubmit = async e => { e.preventDefault(); const n = mm.querySelector('#nv-n').value.trim(); if (!n) { mm.querySelector('#nv-err').textContent = 'Add a name.'; return; }
      try { const t = mm.querySelector('[name=nvt]:checked').value, { vendor } = await api('adminNewVendor', { name: n, type: t }); vendor.cats = [...ti(t).cats]; AD.vendors.unshift(vendor); VD = clone(vendor); VTAB = 'basics'; mm.remove(); go('admin/page/' + vendor.id); } catch (x) { mm.querySelector('#nv-err').textContent = x.message; } }; }, () => {}); };
  ['#newv', '#newv2'].forEach(s => { const b = $(s); if (b) b.onclick = nv; });
  $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Link copied'); } catch { prompt('Copy this link', b.dataset.copy); } }); };
V['admin/page'] = () => { const g = needAd(); if (g) return g; const v = AD.vendors.find(x => x.id === PARAM); if (!v) return page('admin', '<section class="s"><div class="wrap"><a class="u" href="#/admin/vendors">← Vendor pages</a><p>Page not found.</p></div></section>');
  if (!VD || VD.id !== v.id) { VD = clone(v); saveState = ''; } if (!(VD.cats || []).length) VD.cats = [...ti(VD.type).cats]; return `${header('admin')}${builder('admin')}`; };

V['admin/crew'] = () => needAd() || page('admin', `<section class="s"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap"><div><p class="caps m" style="margin:0">Crew</p><h1 class="d2" style="margin-top:14px">Your people.</h1></div><button class="btn ln sm" type="button" data-copy="${location.origin}${location.pathname}#/join/staff">Copy crew sign-up link</button></div>

function modal(html, after, onClose) { const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.innerHTML = `<div>${html}</div>`; document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', k); onClose ? onClose() : render(); }; const k = e => { if (e.key === 'Escape' && document.body.contains(m)) close(); }; document.addEventListener('keydown', k);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(); }); after && after(m); return m; }
function openCal(done) { const u = `${CAL}?hide_gdpr_banner=1&name=${encodeURIComponent(SESS?.account?.name || '')}&email=${encodeURIComponent(SESS?.account?.email || '')}`;
  const m = modal(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 class="d3">Book your discovery call</h2><button class="btn ln sm" type="button" data-close>Close</button></div><iframe src="${u}" title="Book a call on Calendly" style="width:100%;height:620px;border:0;border-radius:14px"></iframe><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn bl" type="button" id="didbook">I booked my call</button></div>`, null, () => {});
  m.querySelector('#didbook').onclick = () => { m.remove(); done(); }; }
function go(r) { location.hash = '#/' + r; }
function render() { const raw = location.hash.replace(/^#\/?/, ''); let [r, qs] = raw.split('?'); QS = new URLSearchParams(qs || ''); PARAM = null;
  for (const p of ['admin/event', 'admin/page', 'vendor/join', 'event', 'v']) if (r.startsWith(p + '/')) { PARAM = decodeURIComponent(r.slice(p.length + 1)); r = p; }
  $('#app').innerHTML = (V[r] || V[''])(); (H[r] || (() => {}))();
  const o = $('#out'); if (o) o.onclick = () => { if (r.startsWith('admin')) { ADM = ''; AD = null; store.set('ce-adm', null); } else { setSess(null); EV = null; VD = null; ST = null; } go(''); }; }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
$('#reset').onclick = e => { e.preventDefault(); setSess(null); D = blankDraft(); store.set('ce-draft', D); EV = null; VD = null; ST = null; PEND = null; INV = null; go(''); render(); };
render(); loadLive().then(() => { if (/^#\/?(start|events|event\/|guide)/.test(location.hash)) render(); });
